<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tv.css">
    <link rel="stylesheet" href="light-tv.css">
    <title>Välkommen till Kronängs IF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #07111f;
            --panel: rgba(15, 23, 42, 0.88);
            --panel-2: rgba(30, 41, 59, 0.92);
            --border: rgba(148, 163, 184, 0.18);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent-2: #38bdf8;
            --warning: #f59e0b;
        }
        html, body {
            height: 100%;
            background:
                radial-gradient(circle at top left, rgba(34, 197, 94, 0.18), transparent 32%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.14), transparent 24%),
                linear-gradient(180deg, #050b15 0%, var(--bg) 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .hero {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 110px 16px 22px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(5, 11, 21, 0.96), rgba(5, 11, 21, 0.6));
            backdrop-filter: blur(10px);
        }
        .hero-brand {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }
        .hero-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .date-nav {
            display: flex;
            gap: 6px;
            flex: 0 0 auto;
            position: absolute;
            top: 8px;
            right: 22px;
            transform: none;
        }
        .date-nav button {
            width: 34px;
            height: 34px;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #ffffff;
            color: #4b5563;
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
        }
        .date-nav button:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .logo {
            width: clamp(72px, 8vw, 110px);
            height: clamp(72px, 8vw, 110px);
            object-fit: contain;
            flex: 0 0 auto;
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.3));
        }
        .title-wrap {
            min-width: 0;
        }
        h1 {
            font-size: clamp(2.8rem, 6.4vw, 5.8rem);
            line-height: 0.96;
            font-weight: 800;
            letter-spacing: -0.04em;
        }
        .subtitle {
            margin-top: 10px;
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 52rem;
        }
        .meta {
            text-align: right;
            flex: 0 0 auto;
            padding-top: 24px;
        }
        .date {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .updated {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .page-status {
            display: none;
        }
        .rooms-link {
            display: inline-block;
            margin-top: 10px;
            color: rgba(203, 213, 225, 0.58);
            font-size: 0.72rem;
            text-decoration: none;
        }
        .rooms-link:hover {
            color: #bbf7d0;
            text-decoration: underline;
        }
        .badge {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.12);
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, 0.22);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.12);
        }
        .content {
            flex: 1;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px 22px 24px;
        }
        .content::-webkit-scrollbar {
            width: 8px;
        }
        .content::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.28);
            border-radius: 999px;
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .cards:has(.match-card:only-child) {
            grid-template-columns: 1fr;
            grid-template-rows: auto;
        }
        .cards:has(.match-card:only-child) .match-card {
            min-height: 0;
            overflow: visible;
        }
        .match-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 220px;
            padding: 18px;
            width: 100%;
            border-radius: 22px;
            background: #ffffff;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 26px 60px rgba(0, 0, 0, 0.22);
            position: relative;
            overflow: hidden;
        }
        .match-card::before {
            display: none;
        }
        .match-top {
            display: block;
            position: relative;
            z-index: 1;
        }
        .kickoff {
            display: none;
        }
        .tag {
            display: none;
        }
        .team-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
        }
        .team {
            font-size: clamp(1.1rem, 1.7vw, 1.45rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: #cbd5e1;
            text-transform: uppercase;
            flex: 1 1 auto;
            min-width: 0;
        }
        .meta-line {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.45em;
            font-size: 1.12rem;
            line-height: 1.2;
            font-weight: 700;
            color: #cbd5e1;
        }
        .meta-line .meta-team {
            color: #dbeafe;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .meta-line .meta-venue {
            color: #94a3b8;
            font-weight: 700;
        }
        .referee-line {
            position: relative;
            z-index: 1;
            color: #526174;
            font-size: 0.92rem;
            font-weight: 700;
        }
        .meta-line .meta-sep {
            color: #718096;
            font-weight: 800;
        }
        .match-title {
            position: relative;
            z-index: 1;
            display: block;
            font-size: clamp(2.1rem, 3.4vw, 3.6rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.06em;
            color: var(--text);
        }
        .match-title .match-home {
            color: #86efac;
        }
        .match-title .match-away {
            color: #93c5fd;
        }
        .match-topline {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .match-kickoff {
            color: #1d4ed8;
            font-size: clamp(1.6rem, 2.5vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -0.05em;
        }
        .match-kind {
            display: none;
        }
        .team-showcase {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 180px minmax(0, 1fr);
            align-items: center;
            gap: 22px;
            padding: 6px 0 14px;
        }
        .team-showcase-side {
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            justify-content: center;
        }
        .team-showcase-side.away {
            justify-content: center;
            text-align: center;
        }
        .team-showcase-side.away .team-showcase-copy {
            order: 0;
        }
        .team-logo {
            width: 156px;
            height: 156px;
            flex: 0 0 156px;
            object-fit: contain;
            border-radius: 0;
            background: transparent;
            padding: 0;
            box-shadow: none;
            mix-blend-mode: multiply;
            background-color: #ffffff;
        }
        .team-showcase-copy {
            min-width: 0;
        }
        .team-showcase-name {
            color: var(--tv-text, #172033);
            font-size: clamp(1.1rem, 2vw, 1.7rem);
            font-weight: 900;
            line-height: 1.05;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .team-showcase-group {
            margin-top: 7px;
            color: #526174;
            font-size: 1.15rem;
            font-weight: 800;
        }
        .team-room {
            margin-top: 2px;
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            padding: 6px 14px;
            border: 3px solid #64748b;
            border-radius: 999px;
            background: #e2e8f0;
            color: #1e293b;
            font-size: clamp(0.98rem, 1.25vw, 1.15rem);
            font-weight: 800;
            line-height: 1.2;
        }
        .team-showcase-side.home .team-room {
            border-color: #15803d;
            background: #bbf7d0;
            color: #14532d;
            box-shadow: 0 3px 9px rgba(22, 101, 52, 0.3);
        }
        .team-showcase-side.away .team-room {
            border-color: #1d4ed8;
            background: #bfdbfe;
            color: #1e3a8a;
            box-shadow: 0 3px 9px rgba(29, 78, 216, 0.28);
        }
        .room-number {
            color: inherit;
            font-size: 1.35em;
            font-weight: 900;
        }
        .match-info-lines {
            position: relative;
            z-index: 1;
            display: grid;
            gap: 7px;
            margin-top: 2px;
            text-align: center;
        }
        .match-info-line {
            color: #526174;
            font-size: 1rem;
            font-weight: 800;
            line-height: 1.2;
        }
        .match-info-line.teams {
            color: #172033;
            font-size: clamp(1.1rem, 1.7vw, 1.4rem);
            font-weight: 900;
        }
        .match-info-line.venue { color: #172033; }
        .match-info-paired {
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px 18px;
        }
        .match-info-paired .match-info-line { margin: 0; }
        .match-info-paired .match-info-line + .match-info-line::before {
            content: '·';
            margin-right: 18px;
            color: #94a3b8;
        }
        .match-info-line.referee {
            color: #172033;
            font-size: 1.08rem;
            font-weight: 900;
        }
        .team-showcase-vs-wrap {
            display: grid;
            justify-items: center;
            gap: 12px;
            min-width: 0;
            width: 100%;
        }
        .team-showcase-kickoff {
            color: #4b5563 !important;
            font-size: clamp(1.55rem, 2.4vw, 2.2rem);
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 1;
        }
        .match-time-plan {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 100%;
            line-height: 1.05;
        }
        .match-plan-separator {
            color: #4b5563;
            font-size: clamp(1.35rem, 2vw, 1.8rem);
            font-weight: 900;
            line-height: 1;
        }
        .match-plan {
            color: #4b5563 !important;
            font-size: clamp(1.55rem, 2.4vw, 2.2rem);
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 1;
            max-width: 100%;
            overflow-wrap: anywhere;
            text-align: center;
        }
        .match-level {
            color: #4b5563 !important;
            font-size: clamp(1.8rem, 3vw, 2.65rem);
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
        }
        .match-weather-compact {
            color: #526174;
            font-size: 1.05rem;
            font-weight: 900;
            white-space: nowrap;
        }
        .team-showcase-vs {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #ffffff;
            color: #526174;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.08em;
        }
        .desc {
            position: relative;
            z-index: 1;
            font-size: 1.02rem;
            font-weight: 700;
            color: #e2e8f0;
        }
        .details {
            display: none;
        }
        .room-summary {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 12px;
            padding: 14px 16px;
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            background: #eff6ff;
            color: #172033;
        }
        .room-summary-label {
            width: 100%;
            color: #526174;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .room-summary-value {
            color: #166534;
            font-size: clamp(1.08rem, 1.6vw, 1.42rem);
            font-weight: 900;
        }
        .room-summary-value.away { color: #1d4ed8; }
        .room-summary-separator { color: #64748b; font-weight: 900; }
        .room-summary-time {
            margin-left: auto;
            color: #526174;
            font-size: 0.82rem;
            font-weight: 800;
        }
        .detail-box {
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.16);
        }
        .detail-label {
            color: var(--muted);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .detail-value {
            font-size: 1rem;
            line-height: 1.35;
            font-weight: 600;
        }
        .room-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .room-card {
            border-radius: 16px;
            padding: 16px 16px 15px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(255, 255, 255, 0.05);
            min-height: 132px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .room-card.home {
            background: linear-gradient(180deg, rgba(34, 197, 94, 0.24), rgba(255, 255, 255, 0.05));
            border-color: rgba(34, 197, 94, 0.34);
        }
        .room-card.away {
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.22), rgba(255, 255, 255, 0.05));
            border-color: rgba(56, 189, 248, 0.3);
        }
        .room-head {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            font-size: clamp(1rem, 1.35vw, 1.25rem);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 900;
        }
        .room-card.home .room-head {
            color: #dcfce7;
        }
        .room-card.home .room-code {
            color: #f0fdf4;
        }
        .room-card.away .room-head {
            color: #e0f2fe;
        }
        .room-card.away .room-code {
            color: #eff6ff;
        }
        .room-code {
            font-size: clamp(1.7rem, 2.35vw, 2.3rem);
            line-height: 0.95;
            font-weight: 900;
            letter-spacing: -0.06em;
            margin-top: 2px;
        }
        .venue-main {
            color: #cbd5e1;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .venue-detail {
            color: #94a3b8;
        }
        .room-note {
            color: rgba(248, 250, 252, 0.82);
            font-size: 0.92rem;
            line-height: 1.35;
        }
        .weather {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 1rem;
            font-weight: 700;
            min-height: 48px;
        }
        .weather::first-letter {
            text-transform: uppercase;
        }
        .empty {
            grid-column: 1 / -1;
            min-height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: 28px;
            border-radius: 22px;
            border: 1px dashed rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.5);
            color: var(--muted);
        }
        .empty strong {
            color: var(--text);
            font-size: 1.2rem;
        }

        /* TV layout: two compact columns keep six matches visible at once. */
        @media (min-width: 900px) {
            .hero {
                padding: 12px 18px 10px;
            }
            .logo {
                width: clamp(58px, 6vw, 82px);
                height: clamp(58px, 6vw, 82px);
            }
            h1 {
                font-size: clamp(2.8rem, 5vw, 5rem);
            }
            .badge {
                margin-bottom: 7px;
                padding: 6px 10px;
                font-size: 0.72rem;
            }
            .content {
                padding: 12px 18px 16px;
            }
            .cards {
                height: auto;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(3, auto);
                gap: 8px;
            }
            .match-card {
                min-height: 0;
                overflow: visible;
                padding: 8px;
                gap: 4px;
                border-radius: 16px;
            }
            .match-title {
                font-size: clamp(1.35rem, 2.1vw, 2.15rem);
                line-height: 1;
            }
            .meta-line {
                font-size: 0.88rem;
            }
            .details {
                gap: 6px;
            }
            .detail-box {
                padding: 8px 10px;
            }
            .detail-label {
                margin-bottom: 4px;
                font-size: 0.58rem;
            }
            .room-grid {
                gap: 8px;
            }
            .room-card {
                min-height: 78px;
                padding: 9px;
                gap: 5px;
                border-radius: 11px;
            }
            .room-head {
                font-size: 0.76rem;
            }
            .room-code {
                font-size: clamp(1.05rem, 1.5vw, 1.55rem);
            }
            .room-note {
                display: none;
            }
            .weather {
                min-height: 34px;
                margin-top: 0;
                padding: 6px 10px;
                font-size: 0.82rem;
            }
        }
        @media (max-width: 899px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .details {
                grid-template-columns: 1fr;
            }
            .room-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 720px) {
            .hero {
                padding-right: 22px;
            }
            .date-nav {
                position: static;
                transform: none;
                order: 2;
            }
            .hero {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero-brand {
                align-items: flex-start;
            }
            .meta {
                text-align: left;
                padding-top: 0;
            }
            .content {
                padding: 16px;
            }
            .match-card {
                min-height: 200px;
            }
            .team-showcase {
                gap: 8px;
            }
            .team-showcase-side {
                flex-direction: column;
                gap: 7px;
                text-align: center;
            }
            .team-showcase-side.away {
                text-align: center;
            }
            .team-showcase-side.away .team-showcase-copy {
                order: 0;
            }
            .team-logo {
                width: 72px;
                height: 72px;
                flex-basis: 72px;
            }
        }
        @media (min-width: 900px) {
            .cards:has(.match-card:only-child) {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .cards:has(.match-card:only-child) .match-card {
                min-height: 0;
                overflow: visible;
            }
            .match-topline {
                gap: 9px;
            }
            .match-kickoff {
                font-size: clamp(1.1rem, 1.7vw, 1.55rem);
            }
            .match-kind {
                font-size: 0.58rem;
            }
            .team-showcase {
                gap: 12px;
                padding-bottom: 6px;
            }
            .team-showcase-side {
                gap: 4px;
            }
            .team-logo {
                width: 118px;
                height: 118px;
                flex-basis: 118px;
            }
            .team-showcase-name {
                font-size: clamp(1rem, 1.7vw, 1.45rem);
            }
            .team-room { font-size: 0.86rem; }
            .room-number { font-size: 1.25em; }
            .team-showcase-kickoff,
            .match-plan { font-size: clamp(1.35rem, 2vw, 1.8rem); }
            .match-level { font-size: clamp(1.45rem, 2.3vw, 2rem); }
            .match-info-lines { gap: 3px; }
            .match-info-line { font-size: 0.82rem; }
            .match-info-line.referee { font-size: 0.88rem; }
            .team-showcase-group {
                margin-top: 3px;
                font-size: 0.68rem;
            }
            .team-showcase-vs {
                width: 44px;
                height: 44px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-left">
            <nav class="date-nav" aria-label="Bläddra mellan matchdagar">
                <button id="previousDateButton" type="button" aria-label="Föregående dag">‹</button>
                <button id="nextDateButton" type="button" aria-label="Nästa dag">›</button>
            </nav>
            <div class="hero-brand">
                <img class="logo" src="kronang-logo-2026.png" alt="Kronängs IF logotyp">
                <div class="title-wrap">
                    <div class="badge"><span class="badge-dot"></span>Hemmamatcher idag</div>
                    <h1>Välkommen till Kronängs IF</h1>
                </div>
            </div>
        </div>
        <div class="meta">
            <div class="date" id="dateLabel">-</div>
            <div class="updated" id="updatedLabel">Laddar...</div>
            <div class="page-status" id="pageStatus">Kontrollerar sidan...</div>
        </div>
    </header>

    <main class="content">
        <section class="cards" id="cards">
            <div class="empty"><strong>Laddar matcher...</strong><span>Hämtar dagens data.</span></div>
        </section>
    </main>

    <script>
        function todayIsoLocal() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const minimumBrowseDate = todayIsoLocal();
        const maximumBrowseDate = (() => {
            const date = new Date(`${minimumBrowseDate}T12:00:00`);
            date.setDate(date.getDate() + 7);
            return date.toISOString().slice(0, 10);
        })();
        let viewedDateIso = minimumBrowseDate;

        function shiftDate(dateIso, amount) {
            const date = new Date(`${dateIso}T12:00:00`);
            date.setDate(date.getDate() + amount);
            return date.toISOString().slice(0, 10);
        }

        function updateDateNavigation() {
            document.getElementById('previousDateButton').disabled = viewedDateIso <= minimumBrowseDate;
            document.getElementById('nextDateButton').disabled = viewedDateIso >= maximumBrowseDate;
        }

        function formatLocalDate(dateIso) {
            const date = new Date(`${dateIso}T12:00:00`);
            const formatter = new Intl.DateTimeFormat('sv-SE', {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            });
            const label = formatter.format(date);
            return label.charAt(0).toUpperCase() + label.slice(1);
        }

        function formatUpdatedLabel(value) {
            if (!value) return 'Senast uppdaterad: okänt';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Senast uppdaterad: okänt';
            return `Senast uppdaterad: ${date.toLocaleString('sv-SE')}`;
        }

        function formatVenue(location) {
            const cleaned = cleanLocation(location || '');
            const planOnly = cleaned.match(/\b([ab]-plan)\b/i);
            if (planOnly) {
                return {
                    main: `${planOnly[1].charAt(0).toUpperCase()}${planOnly[1].slice(1).toLowerCase()}`,
                    detail: ''
                };
            }
            const match = cleaned.match(/^(Kronängs?\s+Arena)\s*(.*)$/i);
            if (!match) {
                return {
                    main: cleaned || 'Kronäng Arena',
                    detail: ''
                };
            }

            // A generic arena name adds no useful information to the card.
            if (!normalizeVenueDetail(match[2])) return null;

            return {
                main: 'Kronäng Arena',
                detail: normalizeVenueDetail(match[2])
            };
        }

        function normalizeVenueDetail(detail) {
            if (!detail) return '';
            return String(detail)
                .replace(/^\s*\(+\s*/, '')
                .replace(/\s*\)+\s*$/, '')
                .replace(/\(\s*\)/g, '')
                .trim();
        }

        function parseOpponent(description) {
            if (!description) return 'Motståndarlaget';
            const firstPart = String(description).split(',')[0].trim();
            const withoutVenueWord = firstPart.replace(/\s+(hemma|borta)\s*$/i, '').trim();
            return withoutVenueWord || 'Motståndarlaget';
        }

        function isHomeMatch(item) {
            const haystack = [item.team, item.description, item.location]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            if (haystack.includes('borta')) return false;
            return haystack.includes('hemma');
        }

        function deduplicateMatches(matches) {
            const seen = new Set();
            return matches.filter(match => {
                const key = [match.date, match.time, match.team, match.description]
                    .map(value => String(value || '').trim().toLowerCase().replace(/\s+/g, ' '))
                    .join('|');
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function cleanLocation(location) {
            if (!location) return '';
            return String(location).replace(/\(\s*\)\s*$/, '').trim();
        }

        function parseHomeNotation(description) {
            if (!description) return null;
            const match = description.match(/\(\s*(H\d+)\s*(?:[\s,;\-\/:]*?)\s*(B\d+)\s*\)\s*$/i);
            if (!match) return null;
            return {
                raw: `${match[1].toUpperCase()}${match[2].toUpperCase()}`,
                home: match[1].toUpperCase(),
                away: match[2].toUpperCase()
            };
        }

        function stripHomeNotation(description) {
            if (!description) return '';
            return String(description).replace(/\(\s*H\d+\s*(?:[\s,;\-\/:]*?)\s*B\d+\s*\)\s*$/i, '').trim();
        }

        // All eight changing rooms are available. Rooms 4 and 5 are reserved
        // for the senior teams, but must still be part of the allocation pool.
        const AVAILABLE_ROOMS = [1, 2, 3, 4, 5, 6, 7, 8];
        const SENIOR_ONLY_ROOMS = new Set([4, 5]);
        const SMALL_ROOMS = new Set([7, 8]);

        function parseTimeToMinutes(value) {
            const match = String(value || '').match(/^(\d{1,2}):(\d{2})$/);
            if (!match) return null;
            return Number(match[1]) * 60 + Number(match[2]);
        }

        function getTeamAge(team, dateIso) {
            const years = String(team || '').match(/(?:19|20)\d{2}/g);
            if (!years || !years.length) return 13;
            // Use the oldest birth year in a combined age group. Exactly 12 is young.
            const birthYear = Math.min(...years.map(Number));
            return Number(String(dateIso || '').slice(0, 4)) - birthYear;
        }

        function isYoungTeam(team, dateIso) {
            return getTeamAge(team, dateIso) <= 12;
        }

        function isWeekday(dateIso) {
            const day = new Date(`${dateIso}T12:00:00`).getDay();
            return day >= 1 && day <= 5;
        }

        function hashString(value) {
            let hash = 2166136261;
            for (let index = 0; index < value.length; index += 1) {
                hash ^= value.charCodeAt(index);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function shuffledRooms(seed) {
            const rooms = [...AVAILABLE_ROOMS];
            let state = hashString(seed) || 1;
            for (let index = rooms.length - 1; index > 0; index -= 1) {
                state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
                const swapIndex = state % (index + 1);
                [rooms[index], rooms[swapIndex]] = [rooms[swapIndex], rooms[index]];
            }
            return rooms;
        }

        function intervalsOverlap(first, second) {
            return first.start < second.end && second.start < first.end;
        }

        function getRoomInterval(match) {
            const start = parseTimeToMinutes(match.time);
            if (start === null) return null;
            const young = isYoungTeam(match.team, match.date) && !isSeniorRuleTeam(match);
            return {
                start: start - 60,
                end: start + (young ? 120 : 150)
            };
        }

        function isRoomAssignmentMatch(match) {
            return match.type === 'Match' && !/veo\s*kamera/i.test(match.team || '');
        }

        function fixedRoomsFor(match) {
            const team = String(match.team || '').trim().toLowerCase();
            if (team === 'herr' || team === 'herrar') return { home: 5, away: 3 };
            if (team === 'dam' || team === 'damer') return { home: 4, away: 2 };
            if (/U/.test(String(match.team || ''))) return { home: 5, away: 3 };
            return null;
        }

        function isPrimarySeniorTeam(match) {
            const team = String(match.team || '').trim().toLowerCase();
            return team === 'herr' || team === 'herrar' || team === 'dam' || team === 'damer';
        }

        function isULag(match) {
            return /U/.test(String(match.team || ''));
        }

        function isSeniorRuleTeam(match) {
            return isPrimarySeniorTeam(match) || isULag(match);
        }

        function assignmentPriority(match) {
            if (isPrimarySeniorTeam(match)) return 0;
            if (isULag(match)) return 1;
            if (isP16Team(match)) return 2;
            return 3;
        }

        function isYouthTeam(match) {
            return !isSeniorRuleTeam(match) && /^[pf]\s*\d{4}/i.test(String(match.team || '').trim());
        }

        function isP16Team(match) {
            return /^p\s*2016$/.test(String(match.team || '').trim().toLowerCase());
        }

        function roomIsFree(room, interval, usage) {
            return interval && !(usage[room] || []).some(existing => intervalsOverlap(interval, existing));
        }

        function getRoomAssignments(matches) {
            const assignments = new Map();
            const eligible = matches.filter(match => isRoomAssignmentMatch(match) && isHomeMatch(match));
            const usage = Object.fromEntries(AVAILABLE_ROOMS.map(room => [room, []]));

            const canUseRoom = (room, match) => {
                const interval = getRoomInterval(match);
                return interval && !(usage[room] || []).some(existing => intervalsOverlap(interval, existing));
            };
            const reserveRoom = (room, match) => usage[room].push(getRoomInterval(match));

            // Room bookings are for a match slot. Reusing a room for a later
            // kickoff prevents a 19:30 match from becoming unassigned merely
            // because the pre-match window of an 18:00 match overlaps it.
            const bySlot = new Map();
            eligible.forEach(match => {
                const slot = `${match.date}|${match.time || 'unknown'}`;
                if (!bySlot.has(slot)) bySlot.set(slot, []);
                bySlot.get(slot).push(match);
            });

            [...bySlot.values()]
                .sort((first, second) => {
                    const priority = group => group.some(isPrimarySeniorTeam) ? 0
                        : (group.some(isULag) ? 1 : (group.some(isP16Team) ? 2 : 3));
                    return priority(first) - priority(second) || `${first[0].date}|${first[0].time}`.localeCompare(`${second[0].date}|${second[0].time}`);
                })
                .forEach(slotMatches => {
                const used = new Set();
                const p16Matches = slotMatches.filter(isP16Team);
                slotMatches
                    .sort((first, second) => {
                        const fixedOrder = assignmentPriority(first) - assignmentPriority(second);
                        return fixedOrder || String(first.team || '').localeCompare(String(second.team || ''));
                    })
                    .forEach(match => {
                        const fixed = fixedRoomsFor(match);
                        if (fixed && !used.has(fixed.home) && !used.has(fixed.away)
                            && canUseRoom(fixed.home, match) && canUseRoom(fixed.away, match)) {
                            assignments.set(match, fixed);
                            used.add(fixed.home);
                            used.add(fixed.away);
                            reserveRoom(fixed.home, match);
                            reserveRoom(fixed.away, match);
                            return;
                        }

                        const p16HomeRoom = isP16Team(match)
                            ? (p16Matches.length === 1
                                ? [2, 1].find(room => !used.has(room) && canUseRoom(room, match))
                                : [1, 2].find(room => !used.has(room) && canUseRoom(room, match)))
                            : null;
                        const youthTeam = isYouthTeam(match);
                        // Use the regular rooms first. Small rooms 7 and 8 are
                        // a last resort for younger teams only.
                        const preferred = AVAILABLE_ROOMS.filter(room =>
                            !SENIOR_ONLY_ROOMS.has(room) && !SMALL_ROOMS.has(room));
                        const weekdayPreferred = isWeekday(match.date)
                            ? preferred.filter(room => room >= 6)
                            : preferred;
                        const smallRoomFallback = youthTeam
                            ? AVAILABLE_ROOMS.filter(room => SMALL_ROOMS.has(room))
                            : [];
                        const shuffled = shuffledRooms(`${match.date}|${match.time}|${match.team}|${match.description}`);
                        if (p16HomeRoom !== undefined && p16HomeRoom !== null) {
                            const awayCandidates = [
                                ...shuffled.filter(room => weekdayPreferred.includes(room) && !used.has(room) && room !== p16HomeRoom
                                    && !SENIOR_ONLY_ROOMS.has(room) && !(isP16Team(match) && [1, 2].includes(room)) && canUseRoom(room, match)),
                                ...shuffled.filter(room => preferred.includes(room) && !weekdayPreferred.includes(room) && !used.has(room) && room !== p16HomeRoom
                                    && !SENIOR_ONLY_ROOMS.has(room) && !(isP16Team(match) && [1, 2].includes(room)) && canUseRoom(room, match)),
                                ...shuffled.filter(room => smallRoomFallback.includes(room) && !used.has(room) && room !== p16HomeRoom
                                    && !SENIOR_ONLY_ROOMS.has(room) && !(isP16Team(match) && [1, 2].includes(room)) && canUseRoom(room, match))
                            ];
                            if (awayCandidates.length) {
                                assignments.set(match, { home: p16HomeRoom, away: awayCandidates[0] });
                                used.add(p16HomeRoom);
                                used.add(awayCandidates[0]);
                                reserveRoom(p16HomeRoom, match);
                                reserveRoom(awayCandidates[0], match);
                                return;
                            }
                        }
                        const candidates = [
                            ...shuffled.filter(room => weekdayPreferred.includes(room) && !used.has(room) && canUseRoom(room, match)),
                            ...shuffled.filter(room => preferred.includes(room) && !weekdayPreferred.includes(room) && !used.has(room) && canUseRoom(room, match)),
                            ...shuffled.filter(room => smallRoomFallback.includes(room) && !used.has(room) && canUseRoom(room, match))
                        ];
                        if (candidates.length >= 2) {
                            assignments.set(match, { home: candidates[0], away: candidates[1] });
                            used.add(candidates[0]);
                            used.add(candidates[1]);
                            reserveRoom(candidates[0], match);
                            reserveRoom(candidates[1], match);
                        }
                    });
                });

            return assignments;
        }

        function getWeatherLabel(weather) {
            if (!weather) return '';
            return `${weather.icon || ''} ${Math.round(weather.temp)}°C · ${weather.desc || ''}`.trim();
        }

        function formatRoomNumber(room) {
            return String(room || '').replace(/^H/i, '').trim();
        }

        function formatBookingTime(match) {
            const roomInterval = getRoomInterval(match);
            if (!roomInterval) return 'Bokningstid saknas';
            const formatMinutes = minutes => {
                const normalized = (minutes + 1440) % 1440;
                return `${String(Math.floor(normalized / 60)).padStart(2, '0')}:${String(normalized % 60).padStart(2, '0')}`;
            };
            return `Bokat ${formatMinutes(roomInterval.start)} - ${formatMinutes(roomInterval.end)}`;
        }

        function renderCard(match, roomAssignments) {
            const assignedRooms = roomAssignments.get(match);
            const cleanDescription = stripHomeNotation(match.description || '');
            const homeRoom = assignedRooms?.home || '';
            const awayRoom = assignedRooms?.away || '';
            const venue = match.calendar_venue ? formatVenue(match.calendar_venue) : null;
            const opponentName = parseOpponent(cleanDescription || match.description || '');
            const weatherCompact = match.weather
                ? `${match.weather.icon || ''} ${Math.round(match.weather.temp)}°C`.trim()
                : '';
            const bookingText = assignedRooms ? formatBookingTime(match) : 'Ingen rumsbokning kunde göras för denna post.';
            const referees = Array.isArray(match.referees)
                ? match.referees.filter(Boolean)
                : (match.referee ? [match.referee] : []);
            const homeGroup = match.team && !/^herr$|^dam$/i.test(match.team) ? match.team : 'Kronängs IF';

            return `
                <article class="match-card">
                    <div class="team-showcase">
                        <div class="team-showcase-side home">
                            ${match.home_logo_url ? `<img class="team-logo" src="${match.home_logo_url}" alt="Kronängs IF" loading="lazy">` : ''}
                            <div class="team-showcase-name">Kronängs IF</div>
                            <div class="team-room">Omklädningsrum <span class="room-number">${homeRoom ? formatRoomNumber(homeRoom) : '?'}</span></div>
                        </div>
                        <div class="team-showcase-vs-wrap">
                            <div class="match-level">${match.team || homeGroup}</div>
                            <div class="team-showcase-vs">VS</div>
                            <div class="match-time-plan">
                                <div class="team-showcase-kickoff">${match.time || 'Tid saknas'}</div>
                                ${venue ? '<span class="match-plan-separator" aria-hidden="true">·</span>' : ''}
                                ${venue ? `<div class="match-plan">${venue.main}${venue.detail ? ` (${venue.detail})` : ''}</div>` : ''}
                            </div>
                            ${weatherCompact ? `<div class="match-weather-compact">${weatherCompact}</div>` : ''}
                        </div>
                        <div class="team-showcase-side away">
                            ${match.away_logo_url ? `<img class="team-logo" src="${match.away_logo_url}" alt="${opponentName}" loading="lazy">` : ''}
                            <div class="team-showcase-name">${opponentName}</div>
                            <div class="team-room">Omklädningsrum <span class="room-number">${awayRoom ? formatRoomNumber(awayRoom) : '?'}</span></div>
                        </div>
                    </div>
                    <div class="match-info-lines">
                        <div class="match-info-paired">
                            ${referees.length ? `<div class="match-info-line referee">Domare: ${referees.join(', ')}</div>` : ''}
                        </div>
                        <div class="match-info-line">Omklädningsrum bokat: ${bookingText.replace(/^Bokat\s*/, '')}</div>
                    </div>
                    <div class="details">
                        <div class="room-summary">
                            <span class="room-summary-label">Omklädningsrum</span>
                            <span class="room-summary-value">Hemmalag ${homeRoom ? formatRoomNumber(homeRoom) : '?'}</span>
                            <span class="room-summary-separator">·</span>
                            <span class="room-summary-value away">Bortalag ${awayRoom ? formatRoomNumber(awayRoom) : '?'}</span>
                            <span class="room-summary-time">${bookingText}</span>
                        </div>
                    </div>
                </article>
            `;
        }

        let lastSuccessfulRenderAt = 0;

        function formatPageStatus(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Sidstatus okänt';
            return `Sidan kontrollerad: ${date.toLocaleString('sv-SE')}`;
        }

        function showPageError(error) {
            const message = error?.message || 'Okänt fel';
            document.getElementById('pageStatus').textContent = 'Fel – försöker igen automatiskt';
            document.getElementById('cards').innerHTML = `
                <div class="empty">
                    <strong>Kunde inte visa dagens matcher</strong>
                    <span>${message}</span>
                    <span>Försöker igen automatiskt.</span>
                </div>
            `;
        }

        async function loadPage() {
            document.getElementById('dateLabel').textContent = formatLocalDate(viewedDateIso);
            updateDateNavigation();

            try {
                const response = await fetch(`data/calendar.json?t=${Date.now()}`);
                if (!response.ok) throw new Error('Kunde inte läsa data/calendar.json');
                const data = await response.json();

                const uniqueMatches = deduplicateMatches(data.activities || []);
                const homeMatches = uniqueMatches
                    .filter(item => item.type === 'Match')
                    .filter(item => item.date === viewedDateIso)
                    .filter(isHomeMatch)
                    .filter(isRoomAssignmentMatch)
                    .sort((a, b) => `${a.time || ''} ${a.team || ''}`.localeCompare(`${b.time || ''} ${b.team || ''}`));
                const roomAssignments = getRoomAssignments(
                    uniqueMatches.filter(item => item.date === viewedDateIso)
                );

                document.getElementById('updatedLabel').textContent = formatUpdatedLabel(data.last_updated);
                document.getElementById('pageStatus').textContent = formatPageStatus(Date.now());

                const cards = document.getElementById('cards');
                if (!homeMatches.length) {
                    cards.innerHTML = `
                        <div class="empty">
                            <strong>Inga hemmamatcher detta datum</strong>
                        </div>
                    `;
                    lastSuccessfulRenderAt = Date.now();
                    return;
                }

                cards.innerHTML = homeMatches.map(match => renderCard(match, roomAssignments)).join('');
                lastSuccessfulRenderAt = Date.now();
            } catch (error) {
                showPageError(error);
            }
        }

        document.getElementById('previousDateButton').addEventListener('click', () => {
            if (viewedDateIso <= minimumBrowseDate) return;
            viewedDateIso = shiftDate(viewedDateIso, -1);
            loadPage();
        });
        document.getElementById('nextDateButton').addEventListener('click', () => {
            if (viewedDateIso >= maximumBrowseDate) return;
            viewedDateIso = shiftDate(viewedDateIso, 1);
            loadPage();
        });

        loadPage();
        // Refresh the data frequently so a newly published calendar is picked up quickly.
        setInterval(loadPage, 5 * 60 * 1000);
        // A full reload clears stale browser state and recovers from a broken JS render.
        setInterval(() => location.reload(), 60 * 60 * 1000);
        // If repeated data refreshes stop completing, recover without operator intervention.
        setInterval(() => {
            if (lastSuccessfulRenderAt && Date.now() - lastSuccessfulRenderAt > 15 * 60 * 1000) {
                location.reload();
            }
        }, 60 * 1000);
    </script>
</body>
</html>
