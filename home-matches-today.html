<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tv.css">
    <link rel="stylesheet" href="light-tv.css">
    <title>Välkommen till Kronängs IF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #07111f;
            --panel: rgba(15, 23, 42, 0.88);
            --panel-2: rgba(30, 41, 59, 0.92);
            --border: rgba(148, 163, 184, 0.18);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent-2: #38bdf8;
            --warning: #f59e0b;
        }
        html, body {
            height: 100%;
            background:
                radial-gradient(circle at top left, rgba(34, 197, 94, 0.18), transparent 32%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.14), transparent 24%),
                linear-gradient(180deg, #050b15 0%, var(--bg) 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 22px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(5, 11, 21, 0.96), rgba(5, 11, 21, 0.6));
            backdrop-filter: blur(10px);
        }
        .hero-brand {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }
        .logo {
            width: clamp(72px, 8vw, 110px);
            height: clamp(72px, 8vw, 110px);
            object-fit: contain;
            flex: 0 0 auto;
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.3));
        }
        .title-wrap {
            min-width: 0;
        }
        h1 {
            font-size: clamp(2.2rem, 4.8vw, 4.4rem);
            line-height: 0.96;
            font-weight: 800;
            letter-spacing: -0.04em;
        }
        .subtitle {
            margin-top: 10px;
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 52rem;
        }
        .meta {
            text-align: right;
            flex: 0 0 auto;
        }
        .date {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .updated {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .rooms-link {
            display: inline-block;
            margin-top: 10px;
            color: rgba(203, 213, 225, 0.58);
            font-size: 0.72rem;
            text-decoration: none;
        }
        .rooms-link:hover {
            color: #bbf7d0;
            text-decoration: underline;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.12);
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, 0.22);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.12);
        }
        .content {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            padding: 20px 22px 24px;
        }
        .content::-webkit-scrollbar {
            width: 8px;
        }
        .content::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.28);
            border-radius: 999px;
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .match-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 220px;
            padding: 18px;
            width: 100%;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(8, 14, 25, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 26px 60px rgba(0, 0, 0, 0.22);
            position: relative;
            overflow: hidden;
        }
        .match-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), transparent 55%);
            pointer-events: none;
        }
        .match-top {
            display: block;
            position: relative;
            z-index: 1;
        }
        .kickoff {
            display: none;
        }
        .tag {
            display: none;
        }
        .team-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
        }
        .team {
            font-size: clamp(1.1rem, 1.7vw, 1.45rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: #cbd5e1;
            text-transform: uppercase;
            flex: 1 1 auto;
            min-width: 0;
        }
        .meta-line {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.45em;
            font-size: 1.12rem;
            line-height: 1.2;
            font-weight: 700;
            color: #cbd5e1;
        }
        .meta-line .meta-team {
            color: #dbeafe;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .meta-line .meta-venue {
            color: #94a3b8;
            font-weight: 700;
        }
        .meta-line .meta-sep {
            color: #718096;
            font-weight: 800;
        }
        .match-title {
            position: relative;
            z-index: 1;
            display: block;
            font-size: clamp(2.1rem, 3.4vw, 3.6rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.06em;
            color: var(--text);
        }
        .match-title .match-home {
            color: #86efac;
        }
        .match-title .match-away {
            color: #93c5fd;
        }
        .desc {
            position: relative;
            z-index: 1;
            font-size: 1.02rem;
            font-weight: 700;
            color: #e2e8f0;
        }
        .details {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: auto;
        }
        .detail-box {
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.16);
        }
        .detail-label {
            color: var(--muted);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .detail-value {
            font-size: 1rem;
            line-height: 1.35;
            font-weight: 600;
        }
        .room-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .room-card {
            border-radius: 16px;
            padding: 16px 16px 15px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(255, 255, 255, 0.05);
            min-height: 132px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .room-card.home {
            background: linear-gradient(180deg, rgba(34, 197, 94, 0.24), rgba(255, 255, 255, 0.05));
            border-color: rgba(34, 197, 94, 0.34);
        }
        .room-card.away {
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.22), rgba(255, 255, 255, 0.05));
            border-color: rgba(56, 189, 248, 0.3);
        }
        .room-head {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            font-size: clamp(1rem, 1.35vw, 1.25rem);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 900;
        }
        .room-card.home .room-head {
            color: #dcfce7;
        }
        .room-card.home .room-code {
            color: #f0fdf4;
        }
        .room-card.away .room-head {
            color: #e0f2fe;
        }
        .room-card.away .room-code {
            color: #eff6ff;
        }
        .room-code {
            font-size: clamp(1.7rem, 2.35vw, 2.3rem);
            line-height: 0.95;
            font-weight: 900;
            letter-spacing: -0.06em;
            margin-top: 2px;
        }
        .venue-main {
            color: #cbd5e1;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .venue-detail {
            color: #94a3b8;
        }
        .room-note {
            color: rgba(248, 250, 252, 0.82);
            font-size: 0.92rem;
            line-height: 1.35;
        }
        .weather {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 1rem;
            font-weight: 700;
            min-height: 48px;
        }
        .weather::first-letter {
            text-transform: uppercase;
        }
        .empty {
            grid-column: 1 / -1;
            min-height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: 28px;
            border-radius: 22px;
            border: 1px dashed rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.5);
            color: var(--muted);
        }
        .empty strong {
            color: var(--text);
            font-size: 1.2rem;
        }

        /* TV layout: two compact columns keep six matches visible at once. */
        @media (min-width: 900px) {
            .hero {
                padding: 12px 18px 10px;
            }
            .logo {
                width: clamp(58px, 6vw, 82px);
                height: clamp(58px, 6vw, 82px);
            }
            h1 {
                font-size: clamp(2rem, 3.4vw, 3.5rem);
            }
            .badge {
                margin-bottom: 7px;
                padding: 6px 10px;
                font-size: 0.72rem;
            }
            .content {
                padding: 12px 18px 16px;
            }
            .cards {
                height: 100%;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }
            .match-card {
                min-height: 0;
                overflow: hidden;
                padding: 12px;
                gap: 8px;
                border-radius: 16px;
            }
            .match-title {
                font-size: clamp(1.35rem, 2.1vw, 2.15rem);
                line-height: 1;
            }
            .meta-line {
                font-size: 0.88rem;
            }
            .details {
                gap: 6px;
            }
            .detail-box {
                padding: 8px 10px;
            }
            .detail-label {
                margin-bottom: 4px;
                font-size: 0.58rem;
            }
            .room-grid {
                gap: 8px;
            }
            .room-card {
                min-height: 78px;
                padding: 9px;
                gap: 5px;
                border-radius: 11px;
            }
            .room-head {
                font-size: 0.76rem;
            }
            .room-code {
                font-size: clamp(1.05rem, 1.5vw, 1.55rem);
            }
            .room-note {
                display: none;
            }
            .weather {
                min-height: 34px;
                margin-top: 0;
                padding: 6px 10px;
                font-size: 0.82rem;
            }
        }
        @media (max-width: 899px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .details {
                grid-template-columns: 1fr;
            }
            .room-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 720px) {
            .hero {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero-brand {
                align-items: flex-start;
            }
            .meta {
                text-align: left;
            }
            .content {
                padding: 16px;
            }
            .match-card {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-brand">
            <img class="logo" src="kronang-logo-2026.png" alt="Kronängs IF logotyp">
            <div class="title-wrap">
                <div class="badge"><span class="badge-dot"></span>Hemmamatcher idag</div>
                <h1>Välkommen till Kronängs IF</h1>
            </div>
        </div>
        <div class="meta">
            <div class="date" id="dateLabel">-</div>
            <div class="updated" id="updatedLabel">Laddar...</div>
        </div>
    </header>

    <main class="content">
        <section class="cards" id="cards">
            <div class="empty"><strong>Laddar matcher...</strong><span>Hämtar dagens data.</span></div>
        </section>
    </main>

    <script>
        function todayIsoLocal() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatLocalDate(dateIso) {
            const date = new Date(`${dateIso}T12:00:00`);
            const formatter = new Intl.DateTimeFormat('sv-SE', {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            });
            const label = formatter.format(date);
            return label.charAt(0).toUpperCase() + label.slice(1);
        }

        function formatUpdatedLabel(value) {
            if (!value) return 'Senast uppdaterad: okänt';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Senast uppdaterad: okänt';
            return `Senast uppdaterad: ${date.toLocaleString('sv-SE')}`;
        }

        function formatVenue(location) {
            const cleaned = cleanLocation(location || '');
            const match = cleaned.match(/^(Kronängs?\s+Arena)\s*(.*)$/i);
            if (!match) {
                return {
                    main: cleaned || 'Kronäng Arena',
                    detail: ''
                };
            }

            return {
                main: 'Kronäng Arena',
                detail: normalizeVenueDetail(match[2])
            };
        }

        function normalizeVenueDetail(detail) {
            if (!detail) return '';
            return String(detail)
                .replace(/^\s*\(+\s*/, '')
                .replace(/\s*\)+\s*$/, '')
                .replace(/\(\s*\)/g, '')
                .trim();
        }

        function parseOpponent(description) {
            if (!description) return 'Motståndarlaget';
            const firstPart = String(description).split(',')[0].trim();
            const withoutVenueWord = firstPart.replace(/\s+(hemma|borta)\s*$/i, '').trim();
            return withoutVenueWord || 'Motståndarlaget';
        }

        function isHomeMatch(item) {
            const haystack = [item.team, item.description, item.location]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            if (haystack.includes('borta')) return false;
            return haystack.includes('hemma');
        }

        function deduplicateMatches(matches) {
            const seen = new Set();
            return matches.filter(match => {
                const key = [match.date, match.time, match.team, match.description]
                    .map(value => String(value || '').trim().toLowerCase().replace(/\s+/g, ' '))
                    .join('|');
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function cleanLocation(location) {
            if (!location) return '';
            return String(location).replace(/\(\s*\)\s*$/, '').trim();
        }

        function parseHomeNotation(description) {
            if (!description) return null;
            const match = description.match(/\(\s*(H\d+)\s*(?:[\s,;\-\/:]*?)\s*(B\d+)\s*\)\s*$/i);
            if (!match) return null;
            return {
                raw: `${match[1].toUpperCase()}${match[2].toUpperCase()}`,
                home: match[1].toUpperCase(),
                away: match[2].toUpperCase()
            };
        }

        function stripHomeNotation(description) {
            if (!description) return '';
            return String(description).replace(/\(\s*H\d+\s*(?:[\s,;\-\/:]*?)\s*B\d+\s*\)\s*$/i, '').trim();
        }

        // All eight changing rooms are available. Rooms 4 and 5 are reserved
        // for the senior teams, but must still be part of the allocation pool.
        const AVAILABLE_ROOMS = [1, 2, 3, 4, 5, 6, 7, 8];
        const SMALL_ROOMS = new Set([7, 8]);

        function parseTimeToMinutes(value) {
            const match = String(value || '').match(/^(\d{1,2}):(\d{2})$/);
            if (!match) return null;
            return Number(match[1]) * 60 + Number(match[2]);
        }

        function getTeamAge(team, dateIso) {
            const years = String(team || '').match(/(?:19|20)\d{2}/g);
            if (!years || !years.length) return 13;
            // Use the oldest birth year in a combined age group. Exactly 12 is young.
            const birthYear = Math.min(...years.map(Number));
            return Number(String(dateIso || '').slice(0, 4)) - birthYear;
        }

        function isYoungTeam(team, dateIso) {
            return getTeamAge(team, dateIso) <= 12;
        }

        function isWeekday(dateIso) {
            const day = new Date(`${dateIso}T12:00:00`).getDay();
            return day >= 1 && day <= 5;
        }

        function hashString(value) {
            let hash = 2166136261;
            for (let index = 0; index < value.length; index += 1) {
                hash ^= value.charCodeAt(index);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function shuffledRooms(seed) {
            const rooms = [...AVAILABLE_ROOMS];
            let state = hashString(seed) || 1;
            for (let index = rooms.length - 1; index > 0; index -= 1) {
                state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
                const swapIndex = state % (index + 1);
                [rooms[index], rooms[swapIndex]] = [rooms[swapIndex], rooms[index]];
            }
            return rooms;
        }

        function intervalsOverlap(first, second) {
            return first.start < second.end && second.start < first.end;
        }

        function getRoomInterval(match) {
            const start = parseTimeToMinutes(match.time);
            if (start === null) return null;
            const young = isYoungTeam(match.team, match.date);
            return {
                start: start - 60,
                end: start + (young ? 120 : 150)
            };
        }

        function isRoomAssignmentMatch(match) {
            return match.type === 'Match' && !/veo\s*kamera/i.test(match.team || '');
        }

        function fixedRoomsFor(match) {
            const team = String(match.team || '').trim().toLowerCase();
            if (team === 'herr') return { home: 5, away: 3 };
            if (team === 'dam') return { home: 4, away: 2 };
            return null;
        }

        function isP16Team(match) {
            return /^p\s*2016$/.test(String(match.team || '').trim().toLowerCase());
        }

        function roomIsFree(room, interval, usage) {
            return interval && !(usage[room] || []).some(existing => intervalsOverlap(interval, existing));
        }

        function getRoomAssignments(matches) {
            const assignments = new Map();
            const eligible = matches.filter(match => isRoomAssignmentMatch(match) && isHomeMatch(match));
            const usage = Object.fromEntries(AVAILABLE_ROOMS.map(room => [room, []]));

            const canUseRoom = (room, match) => {
                const interval = getRoomInterval(match);
                return interval && !(usage[room] || []).some(existing => intervalsOverlap(interval, existing));
            };
            const reserveRoom = (room, match) => usage[room].push(getRoomInterval(match));

            // Room bookings are for a match slot. Reusing a room for a later
            // kickoff prevents a 19:30 match from becoming unassigned merely
            // because the pre-match window of an 18:00 match overlaps it.
            const bySlot = new Map();
            eligible.forEach(match => {
                const slot = `${match.date}|${match.time || 'unknown'}`;
                if (!bySlot.has(slot)) bySlot.set(slot, []);
                bySlot.get(slot).push(match);
            });

            [...bySlot.values()]
                .sort((first, second) => {
                    const priority = group => group.some(isP16Team) ? 0 : (group.some(fixedRoomsFor) ? 1 : 2);
                    return priority(first) - priority(second) || `${first[0].date}|${first[0].time}`.localeCompare(`${second[0].date}|${second[0].time}`);
                })
                .forEach(slotMatches => {
                const used = new Set();
                const p16Matches = slotMatches.filter(isP16Team);
                slotMatches
                    .sort((first, second) => {
                        const priority = match => fixedRoomsFor(match) ? 0 : (isP16Team(match) ? 1 : 2);
                        const fixedOrder = priority(first) - priority(second);
                        return fixedOrder || String(first.team || '').localeCompare(String(second.team || ''));
                    })
                    .forEach(match => {
                        const fixed = fixedRoomsFor(match);
                        if (fixed && !used.has(fixed.home) && !used.has(fixed.away)
                            && canUseRoom(fixed.home, match) && canUseRoom(fixed.away, match)) {
                            assignments.set(match, fixed);
                            used.add(fixed.home);
                            used.add(fixed.away);
                            reserveRoom(fixed.home, match);
                            reserveRoom(fixed.away, match);
                            return;
                        }

                        const p16HomeRoom = isP16Team(match)
                            ? (p16Matches.length === 1
                                ? [2, 1].find(room => !used.has(room) && canUseRoom(room, match))
                                : [1, 2].find(room => !used.has(room) && canUseRoom(room, match)))
                            : null;
                        const preferred = isYoungTeam(match.team, match.date)
                            ? AVAILABLE_ROOMS
                            : AVAILABLE_ROOMS.filter(room => !SMALL_ROOMS.has(room));
                        const shuffled = shuffledRooms(`${match.date}|${match.time}|${match.team}|${match.description}`);
                        if (p16HomeRoom !== undefined && p16HomeRoom !== null) {
                            const awayCandidates = [
                                ...shuffled.filter(room => preferred.includes(room) && !used.has(room) && room !== p16HomeRoom
                                    && !(isP16Team(match) && [1, 2].includes(room)) && canUseRoom(room, match)),
                                ...shuffled.filter(room => !preferred.includes(room) && !used.has(room) && room !== p16HomeRoom
                                    && !(isP16Team(match) && [1, 2].includes(room)) && canUseRoom(room, match))
                            ];
                            if (awayCandidates.length) {
                                assignments.set(match, { home: p16HomeRoom, away: awayCandidates[0] });
                                used.add(p16HomeRoom);
                                used.add(awayCandidates[0]);
                                reserveRoom(p16HomeRoom, match);
                                reserveRoom(awayCandidates[0], match);
                                return;
                            }
                        }
                        const candidates = [
                            ...shuffled.filter(room => preferred.includes(room) && !used.has(room) && canUseRoom(room, match)),
                            ...shuffled.filter(room => !preferred.includes(room) && !used.has(room) && canUseRoom(room, match))
                        ];
                        if (candidates.length >= 2) {
                            assignments.set(match, { home: candidates[0], away: candidates[1] });
                            used.add(candidates[0]);
                            used.add(candidates[1]);
                            reserveRoom(candidates[0], match);
                            reserveRoom(candidates[1], match);
                        }
                    });
                });

            return assignments;
        }

        function getWeatherLabel(weather) {
            if (!weather) return '';
            return `${weather.icon || ''} ${Math.round(weather.temp)}°C · ${weather.desc || ''}`.trim();
        }

        function formatRoomNumber(room) {
            return String(room || '').replace(/^H/i, '').trim();
        }

        function formatBookingTime(match) {
            const roomInterval = getRoomInterval(match);
            if (!roomInterval) return 'Bokningstid saknas';
            const formatMinutes = minutes => {
                const normalized = (minutes + 1440) % 1440;
                return `${String(Math.floor(normalized / 60)).padStart(2, '0')}:${String(normalized % 60).padStart(2, '0')}`;
            };
            return `Bokat ${formatMinutes(roomInterval.start)} - ${formatMinutes(roomInterval.end)}`;
        }

        function renderCard(match, roomAssignments) {
            const assignedRooms = roomAssignments.get(match);
            const cleanDescription = stripHomeNotation(match.description || '');
            const homeRoom = assignedRooms?.home || '';
            const awayRoom = assignedRooms?.away || '';
            const venue = formatVenue(match.location || '');
            const opponentName = parseOpponent(cleanDescription || match.description || '');
            const weatherLabel = getWeatherLabel(match.weather);
            const bookingText = assignedRooms ? formatBookingTime(match) : 'Ingen rumsbokning kunde göras för denna post.';

            return `
                <article class="match-card">
                    <div class="match-title">${match.time || 'Tid saknas'} - <span class="match-home">Kronängs IF</span> vs <span class="match-away">${opponentName}</span></div>
                    <div class="meta-line">
                        <span class="meta-team">${match.team || 'Okänt lag'}</span>
                        <span class="meta-sep">•</span>
                        <span class="meta-venue">${venue.main}${venue.detail ? ` (${venue.detail})` : ''}</span>
                    </div>
                    <div class="details">
                        <div class="detail-box">
                            <div class="detail-label">Omklädningsrum</div>
                            <div class="detail-value">
                                <div class="room-grid">
                                    <div class="room-card home">
                                        <div class="room-head"><span class="match-home">Kronängs IF</span></div>
                                        <div class="room-code">${homeRoom ? `Omklädningsrum ${formatRoomNumber(homeRoom)}` : 'Omklädningsrum ?'}</div>
                                        <div class="room-note">${bookingText}</div>
                                    </div>
                                    <div class="room-card away">
                                        <div class="room-head"><span class="match-away">${opponentName}</span></div>
                                        <div class="room-code">${awayRoom ? `Omklädningsrum ${formatRoomNumber(awayRoom)}` : 'Omklädningsrum ?'}</div>
                                        <div class="room-note">${bookingText}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${weatherLabel ? `<div class="weather" title="${match.weather.desc || ''}">${weatherLabel}</div>` : ''}
                </article>
            `;
        }

        async function loadPage() {
            const todayIso = todayIsoLocal();
            document.getElementById('dateLabel').textContent = formatLocalDate(todayIso);

            try {
                const response = await fetch(`data/calendar.json?t=${Date.now()}`);
                if (!response.ok) throw new Error('Kunde inte läsa data/calendar.json');
                const data = await response.json();

                const uniqueMatches = deduplicateMatches(data.activities || []);
                const homeMatches = uniqueMatches
                    .filter(item => item.type === 'Match')
                    .filter(item => item.date === todayIso)
                    .filter(isHomeMatch)
                    .filter(isRoomAssignmentMatch)
                    .sort((a, b) => `${a.time || ''} ${a.team || ''}`.localeCompare(`${b.time || ''} ${b.team || ''}`));
                const roomAssignments = getRoomAssignments(
                    uniqueMatches.filter(item => item.date === todayIso)
                );

                document.getElementById('updatedLabel').textContent = formatUpdatedLabel(data.last_updated);

                const cards = document.getElementById('cards');
                if (!homeMatches.length) {
                    cards.innerHTML = `
                        <div class="empty">
                            <strong>Inga hemmamatcher idag</strong>
                        </div>
                    `;
                    return;
                }

                cards.innerHTML = homeMatches.map(match => renderCard(match, roomAssignments)).join('');
            } catch (error) {
                document.getElementById('updatedLabel').textContent = 'Kunde inte ladda sidan';
                document.getElementById('cards').innerHTML = `
                    <div class="empty">
                        <strong>Kunde inte ladda data</strong>
                        <span>${error.message}</span>
                    </div>
                `;
            }
        }

        loadPage();
        // Keep the TV view in sync with the hourly scraper without requiring a reload.
        setInterval(loadPage, 60 * 60 * 1000);
    </script>
</body>
</html>
