<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tv.css">
    <link rel="stylesheet" href="light-tv.css">
    <title>Kommande hemmamatcher och omklädningsrum</title>
    <link rel="icon" type="image/png" href="kronang-logo-2026.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #07111f; --panel: rgba(15, 23, 42, .9); --border: rgba(148,163,184,.2); --text: #f8fafc; --muted: #94a3b8; --green: #22c55e; --blue: #38bdf8; }
        html, body { min-height: 100%; background: linear-gradient(180deg,#050b15 0%,var(--bg) 100%); color: var(--text); font-family: Inter, sans-serif; }
        body { padding: 22px; }
        .page { max-width: 1100px; margin: 0 auto; }
        header { display: flex; align-items: center; gap: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
        .logo { width: 82px; height: 82px; object-fit: contain; }
        h1 { font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1; letter-spacing: -.04em; }
        .subtitle { margin-top: 9px; color: var(--muted); }
        .updated { margin-top: 5px; color: var(--muted); font-size: .82rem; }
        .date-group { margin-top: 22px; }
        .date-title { margin-bottom: 10px; color: #bbf7d0; font-size: 1.05rem; text-transform: capitalize; }
        .match { display: grid; grid-template-columns: minmax(190px,1fr) minmax(300px,2fr); gap: 14px; align-items: stretch; margin-bottom: 12px; padding: 15px; border: 1px solid var(--border); border-radius: 16px; background: linear-gradient(180deg,rgba(30,41,59,.95),rgba(8,14,25,.96)); }
        .match-info { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
        .match-time { color: #86efac; font-size: 1.35rem; font-weight: 800; }
        .match-team { color: #dbeafe; font-weight: 800; }
        .opponent { color: var(--muted); }
        .rooms { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
        .room { padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,.05); }
        .room.home { border-color: rgba(34,197,94,.34); background: linear-gradient(180deg,rgba(34,197,94,.2),rgba(255,255,255,.04)); }
        .room.away { border-color: rgba(56,189,248,.3); background: linear-gradient(180deg,rgba(56,189,248,.18),rgba(255,255,255,.04)); }
        .room-label { color: var(--muted); font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
        .room-number { margin: 5px 0; font-size: 1.5rem; font-weight: 900; }
        .room-time { color: #cbd5e1; font-size: .82rem; }
        .empty { margin-top: 24px; padding: 35px; border: 1px dashed var(--border); border-radius: 16px; text-align: center; color: var(--muted); }
        @media (max-width: 700px) { body { padding: 16px; } header { align-items: flex-start; } .logo { width: 64px; height: 64px; } .match { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main class="page">
    <header>
        <img class="logo" src="kronang-logo-2026.png" alt="Kronängs IF logotyp">
        <div>
            <h1 id="pageTitle">Kommande hemmamatcher och omklädningsrum</h1>
            <div class="subtitle">Alla hemmamatcher från idag och sju dagar framåt</div>
            <div class="updated" id="updatedLabel">Laddar...</div>
        </div>
    </header>
    <section id="schedule"><div class="empty">Laddar kommande matcher...</div></section>
</main>
<script>
    const AVAILABLE_ROOMS = [1, 2, 3, 6, 7, 8];
    const SMALL_ROOMS = new Set([7, 8]);

    function isHomeMatch(item) {
        const text = [item.team, item.description, item.location].filter(Boolean).join(' ').toLowerCase();
        return !text.includes('borta') && text.includes('hemma');
    }
    function isRoomAssignmentMatch(item) { return item.type === 'Match' && !/veo\s*kamera/i.test(item.team || ''); }
    function parseTime(value) {
        const match = String(value || '').match(/^(\d{1,2}):(\d{2})$/);
        return match ? Number(match[1]) * 60 + Number(match[2]) : null;
    }
    function getAge(team, date) {
        const years = String(team || '').match(/(?:19|20)\d{2}/g);
        if (!years?.length) return 13;
        return Number(date.slice(0, 4)) - Math.min(...years.map(Number));
    }
    function isYoung(team, date) { return getAge(team, date) <= 12; }
    function isWeekday(date) { const day = new Date(`${date}T12:00:00`).getDay(); return day >= 1 && day <= 5; }
    function ageGroup(team) {
        const years = String(team || '').match(/(?:19|20)\d{2}/g);
        return years ? years.join('/') : String(team || '').trim().toLowerCase();
    }
    function interval(match, startTrim = 0, endTrim = 0) {
        const start = parseTime(match.time);
        if (start === null) return null;
        const before = isYoung(match.team, match.date) ? 60 : 90;
        const after = isYoung(match.team, match.date) ? 120 : 180;
        const dayStart = new Date(`${match.date}T00:00:00`).getTime();
        return {
            start: dayStart + (start - before + startTrim) * 60000,
            end: dayStart + (start + after - endTrim) * 60000,
            displayStart: start - before + startTrim,
            displayEnd: start + after - endTrim,
            trimMinutes: startTrim + endTrim,
            startTrim,
            endTrim
        };
    }
    function intervalOptions(match) {
        return [[0,0], [15,0], [0,15], [30,0], [0,30], [15,15]]
            .map(([startTrim, endTrim]) => interval(match, startTrim, endTrim));
    }
    function hash(value) {
        let result = 2166136261;
        for (const char of value) { result ^= char.charCodeAt(0); result = Math.imul(result, 16777619); }
        return result >>> 0;
    }
    function shuffled(seed) {
        const rooms = [...AVAILABLE_ROOMS]; let state = hash(seed) || 1;
        for (let i = rooms.length - 1; i > 0; i--) { state = (Math.imul(state, 1664525) + 1013904223) >>> 0; const j = state % (i + 1); [rooms[i], rooms[j]] = [rooms[j], rooms[i]]; }
        return rooms;
    }
    function overlaps(a, b) { return a.start < b.end && b.start < a.end; }
    function fixedRooms(match) {
        const team = String(match.team || '').trim().toLowerCase();
        if (team === 'herr') return { home: 5, away: 3 };
        if (team === 'dam') return { home: 4, away: 2 };
        return null;
    }
    function assignments(matches) {
        const result = new Map(); const usage = Object.fromEntries([...Array(9).keys()].map(room => [room, []]));
        const eligible = matches.filter(match => isRoomAssignmentMatch(match) && isHomeMatch(match));
        let sharingMode = 0;
        const canUse = (room, time, side, group) => {
            if (!time) return false;
            const overlapping = usage[room].filter(item => overlaps(item.time, time));
            if (side === 'away') return overlapping.length === 0;
            if (overlapping.some(item => item.side === 'away')) return false;
            if (sharingMode === 0) return !overlapping.some(item => item.side === 'home');
            if (sharingMode === 1) return !overlapping.some(item => item.side === 'home' && item.ageGroup !== group);
            return true;
        };
        const roomOptions = match => {
            const fixed = fixedRooms(match);
            if (fixed) return [fixed];
            const preferred = isYoung(match.team, match.date) ? AVAILABLE_ROOMS : AVAILABLE_ROOMS.filter(room => !SMALL_ROOMS.has(room));
            const weekdayPreferred = isWeekday(match.date) ? AVAILABLE_ROOMS.filter(room => room >= 6) : preferred;
            const order = shuffled(`${match.date}|${match.time}|${match.team}|${match.description}`);
            const rooms = [
                ...order.filter(room => weekdayPreferred.includes(room)),
                ...order.filter(room => preferred.includes(room) && !weekdayPreferred.includes(room)),
                ...order.filter(room => !preferred.includes(room))
            ];
            const pairs = [];
            rooms.forEach(home => rooms.forEach(away => {
                if (home !== away) pairs.push({ home, away });
            }));
            return pairs;
        };
        const roomPairs = match => {
            const options = intervalOptions(match).filter(Boolean); if (!options.length) return [];
            const rooms = roomOptions(match);
            const candidates = [];
            options.forEach(time => rooms.forEach(pair => {
                if (canUse(pair.home, time, 'home', ageGroup(match.team)) && canUse(pair.away, time, 'away', ageGroup(match.team))) {
                    const smallRoomPenalty = (!isYoung(match.team, match.date) && (SMALL_ROOMS.has(pair.home) || SMALL_ROOMS.has(pair.away))) ? 10 : 0;
                    const weekdayRoomPenalty = isWeekday(match.date)
                        ? ((pair.home <= 3 ? 100 : 0) + (pair.away <= 3 ? 100 : 0))
                        : 0;
                    const balancePenalty = Math.abs(time.startTrim - time.endTrim);
                    const sharing = usage[pair.home].filter(item => item.side === 'home' && overlaps(item.time, time));
                    const differentAgeSharing = sharing.filter(item => item.ageGroup !== ageGroup(match.team)).length;
                    const sharingPenalty = differentAgeSharing * 1000;
                    const differentAgePenalty = differentAgeSharing * 100;
                    candidates.push({ ...pair, time, score: time.trimMinutes * 10 + balancePenalty + weekdayRoomPenalty + smallRoomPenalty + sharingPenalty + differentAgePenalty });
                }
            }));
            return candidates.sort((a, b) => a.score - b.score);
        };
        const pending = eligible.filter(match => interval(match));
        let searchSteps = 0;
        const solve = remaining => {
            searchSteps += 1;
            if (searchSteps > 3000) return false;
            if (!remaining.length) return true;
            let selected = null; let candidates = null;
            remaining.forEach(match => {
                const options = roomPairs(match);
                if (candidates === null || options.length < candidates.length) { selected = match; candidates = options; }
            });
            if (!candidates.length) return false;
            for (const candidate of candidates) {
                result.set(selected, candidate);
                usage[candidate.home].push({ time: candidate.time, side: 'home', ageGroup: ageGroup(selected.team) });
                usage[candidate.away].push({ time: candidate.time, side: 'away', ageGroup: ageGroup(selected.team) });
                if (solve(remaining.filter(match => match !== selected))) return true;
                usage[candidate.home].pop(); usage[candidate.away].pop(); result.delete(selected);
            }
            return false;
        };
        const solveWithSharingFallback = dateMatches => {
            for (sharingMode = 0; sharingMode <= 2; sharingMode += 1) {
                searchSteps = 0;
                if (solve(dateMatches)) return true;
            }
            return false;
        };
        const byDate = new Map();
        pending.forEach(match => {
            if (!byDate.has(match.date)) byDate.set(match.date, []);
            byDate.get(match.date).push(match);
        });
        byDate.forEach(dateMatches => solveWithSharingFallback(dateMatches));
        return result;
    }
    function formatDate(date) { const value = new Date(`${date}T12:00:00`); return new Intl.DateTimeFormat('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' }).format(value); }
    function formatTime(minutes) { const value = (minutes + 1440) % 1440; return `${String(Math.floor(value / 60)).padStart(2,'0')}:${String(value % 60).padStart(2,'0')}`; }
    function opponent(description) { return String(description || '').split(',')[0].replace(/\s+(hemma|borta)\s*$/i, '').trim() || 'Motståndarlaget'; }
    function renderMatch(match, room) {
        const time = room?.time || interval(match);
        const hasRooms = room && Number.isInteger(room.home) && Number.isInteger(room.away);
        const adjustment = time?.trimMinutes ? ` · justerad −${time.trimMinutes} min` : '';
        const booking = time ? `${formatTime(time.displayStart)}–${formatTime(time.displayEnd)}${adjustment}` : 'Tid saknas';
        const roomText = hasRooms
            ? `<div class="room home"><div class="room-label">Kronängs IF</div><div class="room-number">Rum ${room.home}</div><div class="room-time">${booking}</div></div><div class="room away"><div class="room-label">${opponent(match.description)}</div><div class="room-number">Rum ${room.away}</div><div class="room-time">${booking}</div></div>`
            : `<div class="room home"><div class="room-label">Kronängs IF</div><div class="room-number">Ej tilldelat</div><div class="room-time">Alla rum är upptagna under intervallet.</div></div><div class="room away"><div class="room-label">Motståndare</div><div class="room-number">Ej tilldelat</div><div class="room-time">Ingen schemakrock skapas.</div></div>`;
        return `<article class="match"><div class="match-info"><div class="match-time">Matchstart ${match.time || 'Tid saknas'}</div><div class="match-team">${match.team || 'Okänt lag'}</div><div class="opponent">Motståndare: ${opponent(match.description)}</div></div><div class="rooms">${roomText}</div></article>`;
    }
    function localIso(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
    function scheduleRange() { const start = new Date(); start.setHours(12, 0, 0, 0); const end = new Date(start); end.setDate(end.getDate() + 7); return { start: localIso(start), end: localIso(end) }; }
    async function loadPage() {
        try {
            const response = await fetch(`data/calendar.json?t=${Date.now()}`); if (!response.ok) throw new Error('Kunde inte läsa kalenderdata.');
            const data = await response.json(); const range = scheduleRange();
            const matches = (data.activities || []).filter(item => item.date && item.date >= range.start && item.date < range.end).filter(isRoomAssignmentMatch).filter(isHomeMatch).filter(item => interval(item));
            const roomMap = assignments(matches); const schedule = document.getElementById('schedule');
            const lastDate = new Date(`${range.end}T12:00:00`); lastDate.setDate(lastDate.getDate() - 1);
            document.getElementById('pageTitle').textContent = `Omklädningsrum – ${new Intl.DateTimeFormat('sv-SE', { day: 'numeric', month: 'long' }).format(new Date(`${range.start}T12:00:00`))} till ${new Intl.DateTimeFormat('sv-SE', { day: 'numeric', month: 'long', year: 'numeric' }).format(lastDate)}`;
            document.getElementById('updatedLabel').textContent = data.last_updated ? `Kalender uppdaterad: ${new Date(data.last_updated).toLocaleString('sv-SE')}` : '';
            if (!matches.length) { schedule.innerHTML = '<div class="empty">Inga kommande hemmamatcher är registrerade ännu.</div>'; return; }
            const groups = new Map(); matches.forEach(match => { if (!groups.has(match.date)) groups.set(match.date, []); groups.get(match.date).push(match); });
            schedule.innerHTML = [...groups.entries()].sort(([a],[b]) => a.localeCompare(b)).map(([date, items]) => `<section class="date-group"><h2 class="date-title">${formatDate(date)}</h2>${items.map(match => renderMatch(match, roomMap.get(match))).join('')}</section>`).join('');
        } catch (error) { document.getElementById('schedule').innerHTML = `<div class="empty">Kunde inte ladda kalenderdata.<br>${error.message}</div>`; }
    }
    loadPage();
    setInterval(loadPage, 300000);
</script>
</body>
</html>
