<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tv.css">
    <link rel="stylesheet" href="light-tv.css">
    <title>Dagens aktiviteter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #fff;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
        }
        html, body {
            height: 100%;
            background: var(--bg-primary);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 12px 16px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .header-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            flex: 0 0 auto;
        }
        .grid {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
            align-content: start;
        }
        .grid::-webkit-scrollbar {
            width: 6px;
        }
        .grid::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 3px;
        }
        .bucket {
            min-height: 280px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
            overflow: hidden;
        }
        .bucket-header {
            padding: 15px 17px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(15, 23, 42, 0.8);
        }
        .bucket-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .bucket-subtitle {
            margin-top: 5px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .activity-list {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
        }
        .activity-item {
            padding: 14px 16px;
            background: var(--bg-card);
            border-radius: 10px;
            border-left: 3px solid var(--accent);
        }
        .activity-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .activity-time {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .activity-type {
            margin-top: 8px;
            font-size: 0.88rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .activity-team {
            margin-top: 7px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .activity-desc {
            margin-top: 6px;
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.35;
        }
        .activity-location {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.35;
        }
        .activity-weather {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            color: var(--text-primary);
            font-size: 0.8rem;
        }
        .empty-bucket,
        .empty-state {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
        }
        .empty-state {
            grid-column: 1 / -1;
            min-height: 220px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
        }
        @media (max-width: 1400px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* TV profile: fill the available canvas and make the schedule readable at a distance. */
        @media (min-width: 901px) and (min-height: 600px) {
            .header {
                padding: clamp(18px, 2.2vh, 30px) clamp(24px, 2.4vw, 44px);
                border-bottom-width: 3px;
            }

            .header h1 {
                font-size: clamp(2.2rem, 3.2vw, 3.6rem);
                letter-spacing: -0.045em;
            }

            .header-logo {
                width: clamp(52px, 5vw, 76px);
                height: clamp(52px, 5vw, 76px);
            }

            .grid {
                padding: clamp(20px, 2.4vh, 34px) clamp(24px, 2.4vw, 44px);
                gap: clamp(16px, 1.6vw, 28px);
                align-content: stretch;
                grid-auto-rows: minmax(0, 1fr);
            }

            .bucket {
                min-height: 0;
                height: 100%;
                border-radius: 18px;
            }

            .bucket-header {
                padding: clamp(18px, 1.8vw, 28px) clamp(20px, 2vw, 32px);
            }

            .bucket-title {
                font-size: clamp(1.35rem, 2vw, 2.15rem);
            }

            .bucket-subtitle {
                margin-top: 8px;
                font-size: clamp(1rem, 1.35vw, 1.4rem);
            }

            .activity-list {
                gap: clamp(14px, 1.4vw, 24px);
                padding: clamp(18px, 1.8vw, 30px);
                overflow-y: auto;
            }

            .activity-item {
                flex: 1 1 0;
                min-height: clamp(170px, 20vh, 280px);
                padding: clamp(20px, 2vw, 32px);
                border-left-width: 7px;
                border-radius: 16px;
            }

            .activity-time {
                font-size: clamp(1.8rem, 2.8vw, 3rem);
            }

            .activity-type {
                margin-top: 12px;
                font-size: clamp(1rem, 1.35vw, 1.4rem);
            }

            .activity-team {
                margin-top: 10px;
                font-size: clamp(1.45rem, 2.2vw, 2.35rem);
            }

            .activity-desc {
                margin-top: 9px;
                font-size: clamp(1.2rem, 1.7vw, 1.8rem);
                line-height: 1.3;
            }

            .activity-location {
                margin-top: 12px;
                font-size: clamp(1rem, 1.35vw, 1.45rem);
            }

            .activity-weather {
                padding: 8px 13px;
                font-size: clamp(1rem, 1.25vw, 1.35rem);
            }
        }

        /* Compact match cards for match activities. Training activities keep
           their existing schedule presentation. */
        .activity-list.match-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-content: start;
        }
        .activity-item.match-card {
            min-height: 0;
            padding: 10px 12px 9px;
            border: 1px solid #cbd5e1;
            border-left: 1px solid #cbd5e1;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
            color: #172033;
        }
        .match-activity-showcase {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 84px minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }
        .match-activity-side {
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }
        .match-activity-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
            background: #ffffff;
        }
        .match-activity-name {
            width: 100%;
            overflow: hidden;
            color: #172033;
            font-size: 0.78rem;
            font-weight: 900;
            line-height: 1.05;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .match-activity-center {
            display: grid;
            justify-items: center;
            gap: 4px;
            min-width: 0;
        }
        .match-activity-level {
            position: relative;
            z-index: 2;
            transform: translateY(-3px);
            color: #4b5563;
            font-size: 1rem;
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
        }
        .match-activity-vs {
            color: #64748b;
            font-size: 0.62rem;
            font-weight: 900;
        }
        .match-activity-time {
            color: #4b5563;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            white-space: nowrap;
        }
        .match-activity-weather {
            color: #526174;
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .match-activity-details {
            margin-top: 6px;
            overflow: hidden;
            color: #526174;
            font-size: 0.68rem;
            font-weight: 800;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .activity-list.training-list {
            display: grid;
            grid-template-columns: 1fr;
            align-content: start;
        }
        .activity-item.training-card {
            min-height: 0;
            padding: 14px 16px 16px;
            border: 1px solid #cbd5e1;
            border-left: 1px solid #cbd5e1;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
            color: #172033;
        }
        .training-card-head {
            display: grid;
            grid-template-columns: 86px minmax(0, 1fr) auto;
            align-items: stretch;
            column-gap: clamp(22px, 2.5vw, 40px);
            row-gap: 0;
        }
        .training-card-mark {
            display: block;
            width: 86px;
            height: 100%;
            min-height: 92px;
            padding: 0;
            object-fit: contain;
        }
        .training-card-copy {
            min-width: 0;
            align-self: start;
            padding-top: 2px;
        }
        .training-card-time-wrap {
            align-self: start;
            padding-top: 2px;
            text-align: right;
        }
        .training-card-time {
            color: #4b5563;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            white-space: nowrap;
        }
        .training-card-weather {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(8px, 1.4vw, 22px);
            margin-top: 4px;
            color: #526174;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: right;
        }
        .training-card-weather-icon {
            display: inline-block;
            margin-right: 0;
            font-size: clamp(2rem, 4vw, 4rem);
            line-height: 0.65;
            vertical-align: middle;
        }
        .training-card-team {
            margin-top: 0;
            color: #172033;
            font-size: 1.3rem;
            font-weight: 900;
            line-height: 1.1;
        }
        .training-card-desc {
            margin-top: 5px;
            color: #526174;
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.25;
        }
        .training-card-location {
            margin-top: 9px;
            color: #64748b;
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.3;
        }
        @media (min-width: 901px) and (min-height: 600px) {
            .activity-item.training-card {
                padding: 16px 18px 18px;
            }
            .training-card-mark {
                width: clamp(88px, 7vw, 120px);
                min-height: 108px;
                height: 100%;
            }
            .training-card-time {
                font-size: clamp(1.45rem, 1.8vw, 1.9rem);
            }
            .training-card-team {
                font-size: clamp(1.35rem, 1.8vw, 1.9rem);
            }
            .training-card-desc {
                font-size: clamp(1rem, 1.2vw, 1.25rem);
            }
            .training-card-location {
                font-size: clamp(0.82rem, 0.95vw, 1rem);
            }
        }
        @media (max-width: 700px) {
            .activity-list.match-list {
                grid-template-columns: 1fr;
            }
        }
        @media (min-width: 901px) and (min-height: 600px) {
            .activity-item.match-card {
                padding: 12px 14px 10px;
            }
            .match-activity-showcase {
                grid-template-columns: minmax(0, 1fr) 100px minmax(0, 1fr);
                gap: 10px;
            }
            .match-activity-logo {
                width: clamp(58px, 5vw, 78px);
                height: clamp(58px, 5vw, 78px);
            }
            .match-activity-name {
                font-size: clamp(0.8rem, 0.95vw, 1.05rem);
            }
            .match-activity-level {
                font-size: clamp(1.05rem, 1.35vw, 1.45rem);
            }
            .match-activity-time {
                font-size: clamp(1.1rem, 1.45vw, 1.55rem);
            }
            .match-activity-details {
                font-size: clamp(0.7rem, 0.78vw, 0.85rem);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="pageTitle">Dagens aktiviteter</h1>
        <img class="header-logo" src="kronang-logo-2026.png" alt="Kronängs IF logga">
    </div>

    <div class="grid" id="trainingGrid">
        <div class="empty-state">Laddar aktiviteter...</div>
    </div>

    <script>
        const BUCKETS = [
            { key: 'morning', title: '08:00 - 11:00', from: 8, to: 11 },
            { key: 'midday', title: '11:00 - 16:00', from: 11, to: 16 },
            { key: 'afternoon', title: '16:00 - 18:00', from: 16, to: 18 },
            { key: 'evening', title: '18:00 - 21:00', from: 18, to: 21 }
        ];
        const CALENDAR_DATA_URLS = [
            new URL('data/calendar.json', document.baseURI).href,
            'https://raw.githubusercontent.com/kronangsif/kronangsif.github.io/main/data/calendar.json'
        ];

        function todayIsoLocal() {
            return new Intl.DateTimeFormat('sv-SE', {
                timeZone: 'Europe/Stockholm',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date());
        }

        function updatePageTitle(dateIso = todayIsoLocal()) {
            const title = document.getElementById('pageTitle');
            const formatter = new Intl.DateTimeFormat('sv-SE', {
                timeZone: 'Europe/Stockholm',
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            });
            const label = formatter.format(new Date(`${dateIso}T12:00:00`));
            const prettyLabel = label.charAt(0).toUpperCase() + label.slice(1);
            title.textContent = `Dagens aktiviteter - ${prettyLabel}`;
        }

        function parseHour(time) {
            if (!time || !time.includes(':')) return null;
            return Number.parseInt(time.split(':')[0], 10);
        }

        function bucketForHour(hour) {
            return BUCKETS.find(bucket => hour !== null && hour >= bucket.from && hour < bucket.to) || null;
        }

        function formatTimeRange(item) {
            if (!item.time) return 'Tid saknas';
            if (item.end_time && item.end_time !== item.time) {
                return `${item.time} - ${item.end_time}`;
            }
            return item.time;
        }

        function isVisibleActivity(item) {
            const haystack = [item.team, item.description, item.location]
                .filter(Boolean)
                .join(' ')
                .toUpperCase();
            if (haystack.includes('VEO')) return false;
            if (item.type !== 'Match') return true;
            return haystack.includes('HEMMA') && !haystack.includes('BORTA');
        }

        function isHomeMatch(item) {
            const haystack = [item.team, item.description, item.location]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return haystack.includes('hemma') && !haystack.includes('borta');
        }

        function matchOpponent(item) {
            return String(item.description || 'Motståndarlaget')
                .replace(/\s+(hemma|borta)\s*$/i, '')
                .trim() || 'Motståndarlaget';
        }

        function renderMatchActivity(item) {
            const home = isHomeMatch(item);
            const leftName = home ? 'Kronängs IF' : matchOpponent(item);
            const rightName = home ? matchOpponent(item) : 'Kronängs IF';
            const leftLogo = item.home_logo_url;
            const rightLogo = item.away_logo_url;
            const venue = String(item.calendar_venue || item.venue || item.location || '').trim();
            const weather = item.weather ? `${item.weather.icon || ''} ${Math.round(item.weather.temp)}°C`.trim() : '';
            return `
                <div class="activity-item match-card">
                    <div class="match-activity-showcase">
                        <div class="match-activity-side">
                            ${leftLogo ? `<img class="match-activity-logo" src="${leftLogo}" alt="${leftName}" loading="lazy">` : ''}
                            <div class="match-activity-name">${leftName}</div>
                        </div>
                        <div class="match-activity-center">
                            <div class="match-activity-level">${item.team || 'Match'}</div>
                            <div class="match-activity-vs">VS</div>
                            <div class="match-activity-time">${formatTimeRange(item)}</div>
                            ${weather ? `<div class="match-activity-weather">${weather}</div>` : ''}
                        </div>
                        <div class="match-activity-side">
                            ${rightLogo ? `<img class="match-activity-logo" src="${rightLogo}" alt="${rightName}" loading="lazy">` : ''}
                            <div class="match-activity-name">${rightName}</div>
                        </div>
                    </div>
                    ${venue ? `<div class="match-activity-details">${venue}</div>` : ''}
                </div>
            `;
        }

        function renderActivity(item) {
            if (item.type === 'Match') return renderMatchActivity(item);
            return `
                    <div class="activity-item training-card">
                        <div class="training-card-head">
                            <img class="training-card-mark" src="training-player-icon.png" alt="">
                            <div class="training-card-copy">
                                <div class="training-card-team">${item.team || 'Okänt lag'}</div>
                                ${item.description ? `<div class="training-card-desc">${item.description}</div>` : ''}
                                ${item.location ? `<div class="training-card-location">${item.location}</div>` : ''}
                            </div>
                            <div class="training-card-time-wrap">
                                <div class="training-card-time">${formatTimeRange(item)}</div>
                                ${item.weather ? `<div class="training-card-weather"><span class="training-card-weather-icon">${item.weather.icon}</span> ${Math.round(item.weather.temp)}°C</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
        }

        function renderBucket(bucket, items) {
            const itemHtml = items.length
                ? items.map(renderActivity).join('')
                : '<div class="empty-bucket">Inga aktiviteter</div>';

            return `
                <section class="bucket">
                    <div class="bucket-header">
                        <div class="bucket-title">${bucket.title}</div>
                        <div class="bucket-subtitle">${items.length} aktiviteter</div>
                    </div>
                    <div class="activity-list${items.some(item => item.type === 'Match') ? ' match-list' : (items.length ? ' training-list' : '')}">${itemHtml}</div>
                </section>
            `;
        }

        async function loadActivities() {
            const grid = document.getElementById('trainingGrid');
            try {
                let data = null;
                let lastError = null;
                for (const url of CALENDAR_DATA_URLS) {
                    try {
                        const response = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        data = await response.json();
                        break;
                    } catch (error) {
                        lastError = error;
                    }
                }
                if (!data) {
                    throw new Error(`Kalenderdata kunde inte hämtas (${lastError?.message || 'okänt fel'})`);
                }

                const params = new URLSearchParams(window.location.search);
                const viewDate = params.get('date') || todayIsoLocal();
                const demoTraining = params.get('demo') === 'training';
                updatePageTitle(viewDate);
                const activities = demoTraining
                    ? [{
                        date: viewDate,
                        time: '18:00',
                        end_time: '19:30',
                        team: 'P2012',
                        type: 'Träning',
                        description: 'Teknikträning med boll',
                        location: 'Kronäng Arena',
                        weather: { icon: '☁️', temp: 14 }
                    }]
                    : (data.activities || [])
                        .filter(item => item.date === viewDate)
                        .filter(isVisibleActivity)
                        .sort((a, b) => `${a.time}`.localeCompare(`${b.time}`));

                const grouped = new Map(BUCKETS.map(bucket => [bucket.key, []]));
                activities.forEach(item => {
                    const bucket = bucketForHour(parseHour(item.time));
                    if (bucket) grouped.get(bucket.key).push(item);
                });

                const hasVisibleActivities = Array.from(grouped.values()).some(items => items.length > 0);
                if (!hasVisibleActivities) {
                    grid.innerHTML = '<div class="empty-state">Inga aktiviteter detta datum i de valda tidsintervallen.</div>';
                    return;
                }

                grid.innerHTML = BUCKETS
                    .filter(bucket => (grouped.get(bucket.key) || []).length > 0)
                    .map(bucket => renderBucket(bucket, grouped.get(bucket.key) || []))
                    .join('');
            } catch (error) {
                grid.innerHTML = `<div class="empty-state">Kunde inte ladda aktiviteter.<br>${error.message}<br><small>Kontrollera nätanslutningen och öppna sidan via http/https.</small></div>`;
            }
        }

        updatePageTitle();
        loadActivities();
        setInterval(loadActivities, 300000);
    </script>
</body>
</html>
