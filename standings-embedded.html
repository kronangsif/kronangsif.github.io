<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kronängs IF – Tabeller</title>
  <link rel="icon" href="kronang-logo-2026.png">
  <style>
    :root { --ink:#172033; --muted:#687386; --line:#e3e8ef; --accent:#287f7a; --paper:#fff; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:#fff; }
    body { padding:clamp(16px,3vw,34px); }
    .page { max-width:1180px; margin:0 auto; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(2rem,4vw,3.35rem); letter-spacing:-.055em; line-height:1; }
    .top img { width:clamp(46px,6vw,72px); height:clamp(46px,6vw,72px); object-fit:contain; }
    .intro { margin:0 0 22px; color:var(--muted); font-size:.98rem; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .card { border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--paper); box-shadow:0 5px 15px rgba(23,32,51,.08); }
    .card-head { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 20px; background:linear-gradient(135deg,#f4f8fa,#eaf3f2); border-bottom:1px solid var(--line); }
    .card-head h2 { margin:0; font-size:1.45rem; letter-spacing:-.03em; }
    .badge { color:var(--accent); font-size:.76rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:520px; }
    th,td { padding:11px 10px; text-align:right; white-space:nowrap; }
    th:first-child,td:first-child { text-align:left; padding-left:20px; }
    th { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; font-weight:800; background:#fbfcfd; border-bottom:1px solid var(--line); }
    td { font-size:.9rem; border-bottom:1px solid #edf0f4; font-variant-numeric:tabular-nums; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr:first-child { background:rgba(40,127,122,.08); }
    tbody tr:first-child td:first-child { color:var(--accent); }
    .team { display:flex; align-items:center; gap:10px; min-width:190px; font-weight:750; }
    .team img { width:30px; height:30px; object-fit:contain; flex:none; }
    .rank { width:24px; color:var(--muted); font-weight:800; }
    .points { font-size:1.02rem; font-weight:900; color:var(--ink); }
    .empty,.error { padding:24px 20px; color:var(--muted); }
    .updated { margin-top:18px; color:var(--muted); font-size:.78rem; text-align:right; }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } .top { margin-bottom:18px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><h1>Tabeller</h1><img src="kronang-logo-2026.png" alt="Kronängs IF"></header>
    <p class="intro">Aktuell statistik från färdiga matcher i Fogis.</p>
    <section class="grid" id="tables"><p class="empty">Laddar tabeller…</p></section>
    <p class="updated" id="updated"></p>
  </main>
  <script>
    const dataUrls = [new URL('data/calendar.json', document.baseURI).href,'https://raw.githubusercontent.com/kronangsif/kronangsif.github.io/main/data/calendar.json'];
    const params = new URLSearchParams(location.search), wanted = (params.get('team') || '').toLowerCase(), fallbackLogo = 'kronang-logo-2026.png';
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function tableMarkup(table) {
      return `<article class="card"><header class="card-head"><h2>${esc(table.label)}</h2><span class="badge">Fogis</span></header><div class="table-wrap"><table><thead><tr><th>Lag</th><th>P</th><th>V</th><th>O</th><th>F</th><th>Poäng</th></tr></thead><tbody>${table.rows.map((row,index) => `<tr><td><div class="team"><span class="rank">${index + 1}</span><img src="${esc(row.logo || fallbackLogo)}" alt=""><span>${esc(row.name)}</span></div></td><td>${row.played}</td><td>${row.wins}</td><td>${row.draws}</td><td>${row.losses}</td><td class="points">${row.points}</td></tr>`).join('')}</tbody></table></div></article>`;
    }
    async function load() {
      let data;
      for (const url of dataUrls) { try { const response = await fetch(url,{cache:'no-store'}); if (response.ok) { data = await response.json(); break; } } catch (_) {} }
      const all = (data?.standings || []).filter(table => !wanted || table.key === wanted || table.label.toLowerCase() === wanted), root = document.querySelector('#tables');
      if (!all.length) { root.innerHTML = '<p class="error">Kunde inte ladda tabellerna ännu.</p>'; return; }
      root.innerHTML = all.map(tableMarkup).join('');
      if (data.last_updated) document.querySelector('#updated').textContent = `Senast uppdaterad: ${new Date(data.last_updated).toLocaleString('sv-SE')}`;
    }
    load();
  </script>
</body>
</html>
