<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tv.css">
    <link rel="stylesheet" href="light-tv.css">
    <title>Matcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #fff;
            --text-secondary: #94a3b8;
            --accent: #22c55e;
        }
        html, body {
            height: 100%;
            background: var(--bg-primary);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 12px 16px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .rooms-link {
            margin-left: auto;
            margin-right: 14px;
            padding: 9px 12px;
            border: 1px solid rgba(34, 197, 94, 0.55);
            border-radius: 999px;
            color: #bbf7d0;
            background: rgba(34, 197, 94, 0.12);
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        .header-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            flex: 0 0 auto;
        }
        .week-grid {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            align-content: start;
        }
        .week-grid::-webkit-scrollbar {
            width: 6px;
        }
        .week-grid::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 3px;
        }
        .day-card {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
            overflow: hidden;
        }
        .day-card.today {
            border-color: rgba(34, 197, 94, 0.8);
            box-shadow: inset 0 0 0 1px rgba(34, 197, 94, 0.25);
        }
        .day-header {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(15, 23, 42, 0.8);
        }
        .day-label {
            font-size: 1rem;
            font-weight: 700;
        }
        .day-date {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .match-list {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
        }
        .match-item {
            padding: 12px;
            background: var(--bg-card);
            border-radius: 10px;
            border-left: 3px solid var(--accent);
        }
        .match-time {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
        }
        .match-team {
            margin-top: 6px;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .match-desc {
            margin-top: 4px;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.25;
        }
        .match-location {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.35;
        }
        .match-weather {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            color: var(--text-primary);
            font-size: 0.8rem;
        }
        .empty-day,
        .empty-state {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
        }
        .empty-state {
            grid-column: 1 / -1;
            min-height: 220px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
        }
        @media (max-width: 1400px) {
            .week-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        @media (max-width: 1024px) {
            .week-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 700px) {
            .week-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Compact, readable layout for the next three days. */
        .week-grid {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px 18px;
        }

        .week-grid > .match-list-compact {
            height: 100%;
        }
        .day-section {
            margin-bottom: 12px;
        }
        .day-section:last-child {
            margin-bottom: 0;
        }
        .date-heading {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 0 2px 7px;
            color: #172033;
        }
        .date-heading .weekday {
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: capitalize;
        }
        .date-heading .date-number {
            color: #526174;
            font-size: 0.95rem;
            font-weight: 700;
        }
        .match-list-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
        }
        .match-row {
            display: grid;
            grid-template-columns: minmax(90px, max-content) minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 78px;
            padding: 10px 13px;
            border: 1px solid #cbd5e1;
            border-left: 4px solid #2563eb;
            border-radius: 11px;
            background: #f8fafc;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }
        .match-row.home {
            border-left-color: #111827;
        }
        .match-row.away {
            border-left-color: #2563eb;
        }
        .match-row-time {
            color: #1d4ed8;
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1.1;
            white-space: nowrap;
        }
        .match-row.home .match-row-time {
            color: #111827;
        }
        .match-row.away .match-row-time {
            color: #1d4ed8;
        }
        .match-row.away .match-row-team,
        .match-row.away .match-row-desc,
        .match-row.away .match-row-location {
            color: #1d4ed8;
        }
        .match-row-main {
            min-width: 0;
        }
        .match-row-team {
            color: #172033;
            font-size: 1rem;
            font-weight: 800;
        }
        .match-row-desc {
            margin-top: 3px;
            overflow: hidden;
            color: #526174;
            font-size: 1rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .match-row-location {
            margin-top: 3px;
            overflow: hidden;
            color: #64748b;
            font-size: 0.75rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .match-row-weather {
            padding: 6px 8px;
            border-radius: 999px;
            background: #e0ecff;
            color: #1e3a8a;
            font-size: 0.78rem;
            font-weight: 800;
            white-space: nowrap;
        }
        @media (max-width: 900px) {
            .match-list-compact {
                grid-template-columns: 1fr;
            }
        }
        @media (min-height: 800px) and (min-width: 901px) {
            .week-grid {
                padding-top: 18px;
            }
            .day-section {
                margin-bottom: 18px;
            }
            .date-heading .weekday {
                font-size: 1.35rem;
            }
            .date-heading .date-number {
                font-size: 1.05rem;
            }
            .match-row {
                grid-template-columns: minmax(110px, max-content) minmax(0, 1fr) auto;
                min-height: clamp(92px, 10vh, 142px);
                padding: 14px 17px;
            }
            .match-row-time {
                font-size: clamp(1.45rem, 2vw, 2rem);
            }
            .match-row-team {
                font-size: clamp(1.05rem, 1.4vw, 1.35rem);
            }
            .match-row-desc {
                font-size: clamp(0.95rem, 1.15vw, 1.15rem);
            }
            .match-row-location {
                font-size: clamp(0.78rem, 0.95vw, 0.95rem);
            }
            .match-row-weather {
                font-size: 0.9rem;
            }
        }

        /* TV profile: use the full canvas and keep information readable from a distance. */
        @media (min-width: 901px) and (min-height: 600px) {
            .header {
                padding: clamp(18px, 2.2vh, 30px) clamp(24px, 2.4vw, 44px);
                border-bottom-width: 3px;
            }

            .header h1 {
                font-size: clamp(2.2rem, 3.2vw, 3.6rem);
                letter-spacing: -0.045em;
            }

            .header-logo {
                width: clamp(52px, 5vw, 76px);
                height: clamp(52px, 5vw, 76px);
            }

            .week-grid {
                padding: clamp(20px, 2.4vh, 34px) clamp(24px, 2.4vw, 44px);
            }

            .day-section {
                margin-bottom: clamp(20px, 2.4vh, 32px);
            }

            .date-heading {
                gap: 14px;
                margin: 0 4px 12px;
            }

            .date-heading .weekday {
                font-size: clamp(1.45rem, 2.2vw, 2.35rem);
            }

            .date-heading .date-number {
                font-size: clamp(1.1rem, 1.45vw, 1.55rem);
            }

            .match-list-compact {
                gap: clamp(12px, 1.3vw, 22px);
            }

            .match-row {
                min-height: clamp(112px, 14vh, 166px);
                padding: clamp(16px, 1.6vw, 25px) clamp(18px, 1.8vw, 30px);
                grid-template-columns: minmax(120px, max-content) minmax(0, 1fr) auto;
                gap: clamp(16px, 1.6vw, 28px);
                border-left-width: 7px;
                border-radius: 16px;
            }

            .match-row-time {
                font-size: clamp(2rem, 3.1vw, 3.35rem);
            }

            .match-row-team {
                font-size: clamp(1.3rem, 1.9vw, 2.1rem);
                line-height: 1.1;
            }

            .match-row-desc {
                margin-top: 7px;
                font-size: clamp(1.1rem, 1.45vw, 1.65rem);
                line-height: 1.2;
            }

            .match-row-location {
                margin-top: 6px;
                font-size: clamp(0.9rem, 1.05vw, 1.2rem);
            }

            .match-row-weather {
                padding: 9px 13px;
                font-size: clamp(0.95rem, 1.1vw, 1.25rem);
            }
        }

        /* Match cards share the same visual language as the home-match view,
           but intentionally omit changing-room information. */
        .match-list-compact {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            flex: 1 1 auto;
            min-height: 0;
            gap: 12px;
        }
        .match-row,
        .match-row.home,
        .match-row.away {
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: auto;
            overflow: visible;
            min-height: 0;
            height: 100%;
            padding: 11px 16px 18px;
            border: 1px solid #cbd5e1;
            border-left: 1px solid #cbd5e1;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.1);
            color: #172033;
        }
        .match-row-head {
            align-self: flex-start;
            display: flex;
            align-items: center;
            min-height: 1.15rem;
            margin-bottom: 4px;
        }
        .match-row-date {
            color: #172033;
            padding: 3px 8px;
            border-radius: 6px;
            background: #f1f5f9;
            font-size: 0.92rem;
            font-weight: 800;
            text-transform: capitalize;
            white-space: nowrap;
        }
        .match-row-showcase {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 150px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            margin-top: 2px;
            flex: 1 1 auto;
            min-height: 0;
        }
        .match-row-side {
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }
        .match-row-logo {
            width: 122px;
            height: 122px;
            object-fit: contain;
            background: #ffffff;
        }
        .match-row-name {
            width: 100%;
            overflow: visible;
            color: #172033;
            font-size: clamp(0.95rem, 1.35vw, 1.25rem);
            font-weight: 900;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .match-row-center {
            display: grid;
            justify-items: center;
            gap: 7px;
            min-width: 0;
        }
        .match-row-level {
            position: relative;
            z-index: 2;
            transform: translateY(-4px);
            color: #4b5563;
            font-size: clamp(1.2rem, 1.9vw, 1.7rem);
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
        }
        .match-row-vs {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            color: #64748b;
            font-size: 0.72rem;
            font-weight: 900;
        }
        .match-row-kickoff {
            color: #4b5563;
            font-size: clamp(1.25rem, 2vw, 1.75rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            white-space: nowrap;
        }
        .match-row-weather {
            padding: 0;
            background: transparent;
            color: #526174;
            font-size: 0.86rem;
            font-weight: 700;
        }
        .match-row-details {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-top: 10px;
            color: #526174;
            font-size: 0.78rem;
            font-weight: 800;
            text-align: center;
        }
        .match-row-detail + .match-row-detail::before {
            content: '·';
            margin-right: 12px;
            color: #94a3b8;
        }
        .match-row-detail.referee {
            color: #526174;
        }
        @media (min-width: 901px) and (min-height: 600px) {
            .match-row {
                padding: 16px 24px 26px;
            }
            .match-row-head {
                margin-bottom: 5px;
            }
            .match-row-showcase {
                grid-template-columns: minmax(0, 1fr) clamp(180px, 14vw, 240px) minmax(0, 1fr);
                gap: clamp(18px, 2vw, 34px);
            }
            .match-row-logo {
                width: clamp(132px, 14vh, 190px);
                height: clamp(132px, 14vh, 190px);
            }
            .match-row-name {
                font-size: clamp(1.1rem, 1.65vw, 1.7rem);
            }
            .match-row-level {
                font-size: clamp(1.45rem, 2.3vw, 2.3rem);
            }
            .match-row-kickoff {
                font-size: clamp(1.6rem, 2.5vw, 2.5rem);
            }
            .match-row-details {
                font-size: clamp(0.8rem, 0.95vw, 1rem);
            }
            .match-row-date {
                padding: 4px 9px;
                font-size: clamp(1.05rem, 1.2vw, 1.25rem);
            }
        }
        @media (max-width: 900px) {
            .match-list-compact {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                flex: none;
            }
            .match-row { height: auto; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="matchesTitle">⚽ Kommande matcher</h1>
        <img class="header-logo" src="kronang-logo-2026.png" alt="Kronängs IF logga">
    </div>

    <div class="week-grid" id="weekGrid">
        <div class="empty-state">Laddar matcher...</div>
    </div>

    <script>
        const MONTHS = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
        const WEEKDAYS = ['Söndag', 'Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag'];
        const CALENDAR_DATA_URLS = [
            new URL('data/calendar.json', document.baseURI).href,
            'https://raw.githubusercontent.com/kronangsif/kronangsif.github.io/main/data/calendar.json'
        ];

        function todayIsoLocal() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function addDaysIso(baseIso, days) {
            const d = new Date(`${baseIso}T12:00:00`);
            d.setDate(d.getDate() + days);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function opponentName(match) {
            const description = String(match.description || '');
            return description.replace(/\s+(hemma|borta)\s*$/i, '').trim() || 'Motståndarlaget';
        }

        function displayVenue(match) {
            const value = String(match.calendar_venue || match.venue || match.location || '').trim();
            return value.replace(/\s+/g, ' ') || '';
        }

        function refereeLabel(match) {
            const referees = Array.isArray(match.referees) ? match.referees.filter(Boolean) : [];
            return referees.length ? `Domare: ${referees.join(', ')}` : '';
        }

        function formatMatchDate(dateIso) {
            const date = new Date(`${dateIso}T12:00:00`);
            const label = new Intl.DateTimeFormat('sv-SE', {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            }).format(date);
            return label.charAt(0).toUpperCase() + label.slice(1);
        }

        function renderMatch(match) {
            const isHome = isHomeMatch(match);
            const leftName = isHome ? 'Kronängs IF' : opponentName(match);
            const rightName = isHome ? opponentName(match) : 'Kronängs IF';
            const leftLogo = isHome ? match.home_logo_url : match.home_logo_url;
            const rightLogo = isHome ? match.away_logo_url : match.away_logo_url;
            const level = match.team || 'Match';
            const weather = match.weather
                ? `${match.weather.icon || ''} ${Math.round(match.weather.temp)}°C`.trim()
                : '';
            return `
                <article class="match-row ${isHome ? 'home' : 'away'}">
                    <div class="match-row-head">
                        <span class="match-row-date">${formatMatchDate(match.date)}</span>
                    </div>
                    <div class="match-row-showcase">
                        <div class="match-row-side">
                            ${leftLogo ? `<img class="match-row-logo" src="${leftLogo}" alt="${leftName}" loading="lazy">` : ''}
                            <div class="match-row-name">${leftName}</div>
                        </div>
                        <div class="match-row-center">
                            <div class="match-row-level">${level}</div>
                            <div class="match-row-vs">VS</div>
                            <div class="match-row-kickoff">${match.time || 'Tid saknas'}</div>
                            ${weather ? `<div class="match-row-weather">${weather}</div>` : ''}
                        </div>
                        <div class="match-row-side">
                            ${rightLogo ? `<img class="match-row-logo" src="${rightLogo}" alt="${rightName}" loading="lazy">` : ''}
                            <div class="match-row-name">${rightName}</div>
                        </div>
                    </div>
                </article>
            `;
        }

        function isHomeMatch(match) {
            const haystack = [match.team, match.description, match.location]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return haystack.includes('hemma') && !haystack.includes('borta');
        }

        function deduplicateMatches(matches) {
            const seen = new Set();
            return matches.filter(match => {
                const key = [match.date, match.time, match.team, match.description]
                    .map(value => String(value || '').trim().toLowerCase())
                    .join('|');
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function renderDateSection(dateIso, matches) {
            const dateObj = new Date(`${dateIso}T12:00:00`);
            const weekday = WEEKDAYS[dateObj.getDay()];
            const dateLabel = `${dateObj.getDate()} ${MONTHS[dateObj.getMonth()]}`;

            return `
                <section class="day-section">
                    <div class="date-heading">
                        <span class="weekday">${weekday}</span>
                        <span class="date-number">${dateLabel}</span>
                    </div>
                    <div class="match-list-compact">${matches.map(renderMatch).join('')}</div>
                </section>
            `;
        }

        async function loadMatches() {
            const grid = document.getElementById('weekGrid');
            try {
                let data = null;
                let lastError = null;
                for (const url of CALENDAR_DATA_URLS) {
                    try {
                        const response = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        data = await response.json();
                        break;
                    } catch (error) {
                        lastError = error;
                    }
                }
                if (!data) throw new Error(`Kalenderdata kunde inte hämtas (${lastError?.message || 'okänt fel'})`);

                const todayIso = todayIsoLocal();
                document.getElementById('matchesTitle').textContent = '⚽ Kommande matcher';

                const matches = deduplicateMatches((data.activities || [])
                    .filter(item => item.type === 'Match')
                    .filter(item => item.date && item.date >= todayIso)
                    .filter(item => {
                        const haystack = [item.team, item.description, item.location]
                            .filter(Boolean)
                            .join(' ')
                            .toLowerCase();
                        return !haystack.includes('veo');
                    })
                    .sort((a, b) => `${a.date} ${a.time || ''}`.localeCompare(`${b.date} ${b.time || ''}`))
                    .slice(0, 6));

                grid.innerHTML = matches.length
                    ? `<div class="match-list-compact">${matches.map(renderMatch).join('')}</div>`
                    : '<div class="empty-state">Inga kommande matcher.</div>';
            } catch (error) {
                grid.innerHTML = `<div class="empty-state">Kunde inte ladda matcher.<br>${error.message}</div>`;
            }
        }

        loadMatches();
        setInterval(loadMatches, 300000);
    </script>
</body>
</html>
