<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tv.css">
    <link rel="stylesheet" href="light-tv.css">
    <title>Matcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #fff;
            --text-secondary: #94a3b8;
            --accent: #22c55e;
        }
        html, body {
            height: 100%;
            background: var(--bg-primary);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 12px 16px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .rooms-link {
            margin-left: auto;
            margin-right: 14px;
            padding: 9px 12px;
            border: 1px solid rgba(34, 197, 94, 0.55);
            border-radius: 999px;
            color: #bbf7d0;
            background: rgba(34, 197, 94, 0.12);
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        .header-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            flex: 0 0 auto;
        }
        .week-grid {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            align-content: start;
        }
        .week-grid::-webkit-scrollbar {
            width: 6px;
        }
        .week-grid::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 3px;
        }
        .day-card {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
            overflow: hidden;
        }
        .day-card.today {
            border-color: rgba(34, 197, 94, 0.8);
            box-shadow: inset 0 0 0 1px rgba(34, 197, 94, 0.25);
        }
        .day-header {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(15, 23, 42, 0.8);
        }
        .day-label {
            font-size: 1rem;
            font-weight: 700;
        }
        .day-date {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .match-list {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
        }
        .match-item {
            padding: 12px;
            background: var(--bg-card);
            border-radius: 10px;
            border-left: 3px solid var(--accent);
        }
        .match-time {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
        }
        .match-team {
            margin-top: 6px;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .match-desc {
            margin-top: 4px;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.25;
        }
        .match-location {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.35;
        }
        .match-weather {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            color: var(--text-primary);
            font-size: 0.8rem;
        }
        .empty-day,
        .empty-state {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
        }
        .empty-state {
            grid-column: 1 / -1;
            min-height: 220px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
        }
        @media (max-width: 1400px) {
            .week-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        @media (max-width: 1024px) {
            .week-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media (max-width: 700px) {
            .week-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Compact, readable layout for the next three days. */
        .week-grid {
            overflow: hidden;
            display: block;
            padding: 14px 18px;
        }
        .day-section {
            margin-bottom: 12px;
        }
        .day-section:last-child {
            margin-bottom: 0;
        }
        .date-heading {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 0 2px 7px;
            color: #172033;
        }
        .date-heading .weekday {
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: capitalize;
        }
        .date-heading .date-number {
            color: #526174;
            font-size: 0.95rem;
            font-weight: 700;
        }
        .match-list-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
        }
        .match-row {
            display: grid;
            grid-template-columns: minmax(90px, max-content) minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 78px;
            padding: 10px 13px;
            border: 1px solid #cbd5e1;
            border-left: 4px solid #2563eb;
            border-radius: 11px;
            background: #f8fafc;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
        }
        .match-row.home {
            border-left-color: #111827;
        }
        .match-row.away {
            border-left-color: #2563eb;
        }
        .match-row-time {
            color: #1d4ed8;
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1.1;
            white-space: nowrap;
        }
        .match-row.home .match-row-time {
            color: #111827;
        }
        .match-row.away .match-row-time {
            color: #1d4ed8;
        }
        .match-row.away .match-row-team,
        .match-row.away .match-row-desc,
        .match-row.away .match-row-location {
            color: #1d4ed8;
        }
        .match-row-main {
            min-width: 0;
        }
        .match-row-team {
            color: #172033;
            font-size: 1rem;
            font-weight: 800;
        }
        .match-row-desc {
            margin-top: 3px;
            overflow: hidden;
            color: #526174;
            font-size: 0.92rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .match-row-location {
            margin-top: 3px;
            overflow: hidden;
            color: #64748b;
            font-size: 0.75rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .match-row-weather {
            padding: 6px 8px;
            border-radius: 999px;
            background: #e0ecff;
            color: #1e3a8a;
            font-size: 0.78rem;
            font-weight: 800;
            white-space: nowrap;
        }
        @media (max-width: 900px) {
            .match-list-compact {
                grid-template-columns: 1fr;
            }
        }
        @media (min-height: 800px) and (min-width: 901px) {
            .week-grid {
                padding-top: 18px;
            }
            .day-section {
                margin-bottom: 18px;
            }
            .date-heading .weekday {
                font-size: 1.35rem;
            }
            .date-heading .date-number {
                font-size: 1.05rem;
            }
            .match-row {
                grid-template-columns: minmax(110px, max-content) minmax(0, 1fr) auto;
                min-height: clamp(92px, 10vh, 142px);
                padding: 14px 17px;
            }
            .match-row-time {
                font-size: clamp(1.45rem, 2vw, 2rem);
            }
            .match-row-team {
                font-size: clamp(1.05rem, 1.4vw, 1.35rem);
            }
            .match-row-desc {
                font-size: clamp(0.95rem, 1.15vw, 1.15rem);
            }
            .match-row-location {
                font-size: clamp(0.78rem, 0.95vw, 0.95rem);
            }
            .match-row-weather {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="matchesTitle">⚽ Matcher kommande 3 dagar</h1>
        <img class="header-logo" src="kronang-logo-2026.png" alt="Kronängs IF logga">
    </div>

    <div class="week-grid" id="weekGrid">
        <div class="empty-state">Laddar matcher...</div>
    </div>

    <script>
        const MONTHS = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
        const WEEKDAYS = ['Söndag', 'Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag'];

        function todayIsoLocal() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function addDaysIso(baseIso, days) {
            const d = new Date(`${baseIso}T12:00:00`);
            d.setDate(d.getDate() + days);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function renderMatch(match) {
            const isHome = isHomeMatch(match);
            return `
                <article class="match-row ${isHome ? 'home' : 'away'}">
                    <div class="match-row-time">${match.time || 'Tid saknas'}</div>
                    <div class="match-row-main">
                        <div class="match-row-team">${match.team || 'Okänt lag'}</div>
                        <div class="match-row-desc">${match.description || 'Match'}</div>
                        <div class="match-row-location">${match.location || ''}</div>
                    </div>
                    ${match.weather ? `<div class="match-row-weather">${match.weather.icon || ''} ${Math.round(match.weather.temp)}°C</div>` : ''}
                </article>
            `;
        }

        function isHomeMatch(match) {
            const haystack = [match.team, match.description, match.location]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return haystack.includes('hemma') && !haystack.includes('borta');
        }

        function deduplicateMatches(matches) {
            const seen = new Set();
            return matches.filter(match => {
                const key = [match.date, match.time, match.team, match.description]
                    .map(value => String(value || '').trim().toLowerCase())
                    .join('|');
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function renderDateSection(dateIso, matches) {
            const dateObj = new Date(`${dateIso}T12:00:00`);
            const weekday = WEEKDAYS[dateObj.getDay()];
            const dateLabel = `${dateObj.getDate()} ${MONTHS[dateObj.getMonth()]}`;

            return `
                <section class="day-section">
                    <div class="date-heading">
                        <span class="weekday">${weekday}</span>
                        <span class="date-number">${dateLabel}</span>
                    </div>
                    <div class="match-list-compact">${matches.map(renderMatch).join('')}</div>
                </section>
            `;
        }

        async function loadMatches() {
            const grid = document.getElementById('weekGrid');
            try {
                const response = await fetch(`data/calendar.json?t=${Date.now()}`);
                if (!response.ok) throw new Error('Kunde inte läsa datafilen');
                const data = await response.json();

                const todayIso = todayIsoLocal();
                const lastIso = addDaysIso(todayIso, 2);
                document.getElementById('matchesTitle').textContent = '⚽ Matcher kommande 3 dagar';

                const matches = deduplicateMatches((data.activities || [])
                    .filter(item => item.type === 'Match')
                    .filter(item => item.date && item.date >= todayIso && item.date <= lastIso)
                    .filter(item => {
                        const haystack = [item.team, item.description, item.location]
                            .filter(Boolean)
                            .join(' ')
                            .toLowerCase();
                        return !haystack.includes('veo');
                    })
                    .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)));

                const byDate = new Map();
                matches.forEach(match => {
                    if (!byDate.has(match.date)) byDate.set(match.date, []);
                    byDate.get(match.date).push(match);
                });

                const dates = Array.from({ length: 3 }, (_, index) => addDaysIso(todayIso, index));
                const sections = dates
                    .filter(dateIso => (byDate.get(dateIso) || []).length > 0)
                    .map(dateIso => renderDateSection(dateIso, byDate.get(dateIso)));
                grid.innerHTML = sections.length
                    ? sections.join('')
                    : '<div class="empty-state">Inga matcher de kommande tre dagarna.</div>';
            } catch (error) {
                grid.innerHTML = `<div class="empty-state">Kunde inte ladda matcher.<br>${error.message}</div>`;
            }
        }

        loadMatches();
        setInterval(loadMatches, 300000);
    </script>
</body>
</html>
